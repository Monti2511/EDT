const PRESETS = [
  { label: 'All of Earth', es: 'Toda la Tierra', from: 4567, to: 0 },
  { label: 'Precambrian', es: 'Precámbrico', from: 4567, to: 538.8 },
  { label: 'Phanerozoic', es: 'Fanerozoico', from: 538.8, to: 0 },
  { label: 'Paleozoic', es: 'Paleozoico', from: 538.8, to: 251.902 },
  { label: 'Mesozoic', es: 'Mesozoico', from: 251.902, to: 66 },
  { label: 'Cenozoic', es: 'Cenozoico', from: 66, to: 0 },
  { label: 'Last 10 million years', es: 'Últimos 10 millones de años', from: 10, to: 0 },
];

const TAX = { chengjiang: 'vert', jaws: 'gnath', tiktaalik: 'sarco', tetrapods: 'tetra', amniotes: 'amn', synapsids: 'syn', dimetrodon: 'pely',
  pareiasaurs: 'para', eunotosaurus: 'turt', odontochelys: 'turt', lystrosaurus: 'ther', archosaurs: 'arch', dinos: 'dino', pterosaurs: 'ptero',
  mammals: 'mam', jurmammals: 'mam', archaeopteryx: 'birds', metatherians: 'mars', australia: 'mars', placentals: 'plac', mosasaurs: 'squam',
  primates: 'prim', whales: 'cetart', ambulocetus: 'cetart', basilosaurus: 'cetart', baleen: 'cetart', canids: 'carn', dingo: 'carn',
  paraceratherium: 'peris', megalodon: 'chond', hominins: 'prim', lucy: 'prim', homo: 'prim', sapiens: 'prim' };
const NODE = {}, UP = {};
(function walk(n, parent) {
  if (!n.k) n.k = `n${Object.keys(NODE).length}`;
  NODE[n.k] = n;
  UP[n.k] = parent;
  (n.c || []).forEach((c) => walk(c, n.k));
})(TREE, null);
function taxChain(k) {
  const out = [];
  for (let x = k; x; x = UP[x]) out.unshift(NODE[x]);
  return out;
}

const ALL = [...U, ...E];
const byId = Object.fromEntries(ALL.map((x) => [x.id, x]));
const catNo = Object.fromEntries(ALL.map((x, i) => [x.id, String(i + 1).padStart(3, '0')]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const state = { from: 4567, to: 0, sel: 'phanerozoic', study: 'all', lang: 'en', taxOpen: false };
try { if (localStorage.getItem('dt-lang') === 'es') state.lang = 'es'; } catch (e) {}
const $ = (id) => document.getElementById(id);
const tracks = [$('t0'), $('t1'), $('t2'), $('t3')];

const S = () => I18N[state.lang];
const L = (o, k) => (state.lang === 'es' && o.es && o.es[k] != null ? o.es[k] : o[k]);
const nf = (n, d) => n.toLocaleString(state.lang === 'es' ? 'es-ES' : 'en', { maximumFractionDigits: d });
const big = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

function ageText(a) {
  const es = state.lang === 'es';
  if (a <= 0) return es ? 'hoy' : 'today';
  if (a >= 1000) return es ? `hace ${big(a)} millones de años` : `${nf(a / 1000, 3)} billion years ago`;
  if (a >= 1) return es ? `hace ${nf(a, 2)} millones de años` : `${nf(a, 2)} million years ago`;
  return es ? `hace ${nf(Math.round(a * 1e6), 0)} años` : `${nf(Math.round(a * 1e6), 0)} years ago`;
}
const approxText = (a) => (state.lang === 'es' ? `${ageText(a)} (aprox.)` : `About ${ageText(a)}`);
function shortAge(a) {
  if (a <= 0) return state.lang === 'es' ? 'hoy' : 'now';
  if (a >= 1000) return `${nf(a / 1000, 3)} Ga`;
  if (a >= 1) return `${nf(a, 2)} Ma`;
  return `${nf(a * 1000, 1)} ka`;
}
function durText(d) {
  const es = state.lang === 'es';
  if (d >= 1000) return es ? `${big(d)} millones de años` : `${nf(d / 1000, 3)} billion years`;
  if (d >= 1) return es ? `${nf(d, 2)} millones de años` : `${nf(d, 2)} million years`;
  return es ? `${nf(Math.round(d * 1e6), 0)} años` : `${nf(Math.round(d * 1e6), 0)} years`;
}
function clock(a) {
  if (a <= 0) return state.lang === 'es' ? 'medianoche' : 'midnight';
  const s = (1 - a / EARTH) * 86400;
  const p = (n) => String(n).padStart(2, '0');
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const ss = 86400 - s < 60 ? sec.toFixed(2).padStart(5, '0') : p(Math.floor(sec));
  return `${p(h)}:${p(m)}:${ss}`;
}
function ink(hex) {
  const v = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2] > 0.3 ? '#1e1710' : '#ffffff';
}
const parentOf = (u) => U.find((p) => p.rank === u.rank - 1 && p.start >= u.start && p.end <= u.end);
const childrenOf = (u) => U.filter((c) => c.rank === u.rank + 1 && c.start <= u.start && c.end >= u.end);
const unitsAt = (a) => U.filter((u) => a <= u.start && (a > u.end || (u.end === 0 && a >= 0))).sort((p, q) => p.rank - q.rank);
const xOf = (a) => (state.from - a) / (state.from - state.to);
const pct = (f) => `${(f * 100).toFixed(4)}%`;

function drawBands(rank) {
  const track = tracks[rank];
  const W = track.clientWidth;
  track.replaceChildren();
  for (const u of U) {
    if (u.rank !== rank || u.end >= state.from || u.start <= state.to) continue;
    const l = xOf(Math.min(u.start, state.from)), r = xOf(Math.max(u.end, state.to));
    const px = (r - l) * W;
    const name = L(u, 'name');
    const b = document.createElement('button');
    b.className = 'band' + (state.sel === u.id ? ' sel' : '');
    b.style.left = pct(l);
    b.style.width = pct(r - l);
    b.style.background = u.color;
    b.style.color = ink(u.color);
    const charW = rank === 0 ? 10 : 8;
    b.textContent = px > name.length * charW + 14 ? name : px > u.abbr.length * charW + 8 ? u.abbr : '';
    b.title = `${name}: ${shortAge(u.start)} – ${shortAge(u.end)}`;
    b.setAttribute('aria-label', `${name}, ${ageText(u.start)} – ${ageText(u.end)}`);
    b.onclick = () => openUnit(u);
    track.append(b);
  }
  addExtinctionLines(track);
}

function addExtinctionLines(track) {
  for (const e of E) {
    if (e.type !== 'extinction' || e.age > state.from || e.age < state.to) continue;
    const l = document.createElement('div');
    l.className = 'xline';
    l.style.left = pct(xOf(e.age));
    track.append(l);
  }
  if (state.guess != null && state.guess <= state.from && state.guess >= state.to) {
    const g = document.createElement('div');
    g.className = 'guessline';
    g.style.left = pct(xOf(state.guess));
    track.append(g);
  }
}

function eventsInView() {
  return E.filter((e) => e.id !== state.hide && (state.study === 'all' || (state.study === 'mine') === STUDIED.has(e.id))
    && (e.end !== undefined ? e.age > state.to && e.end < state.from : e.age <= state.from + 1e-9 && e.age >= state.to));
}

function drawEvents() {
  const track = $('tev');
  const W = track.clientWidth;
  track.replaceChildren();
  const list = eventsInView();
  const ranges = list.filter((e) => e.type === 'range');
  const points = list.filter((e) => e.type !== 'range').sort((a, b) => b.age - a.age);

  const rLanes = [];
  for (const e of ranges) {
    const l = Math.max(0, xOf(e.age)) * W, r = Math.min(1, xOf(e.end)) * W;
    let lane = rLanes.findIndex((end) => l >= end + 4);
    if (lane === -1) { lane = rLanes.length; rLanes.push(0); }
    rLanes[lane] = r;
    const name = L(e, 'name');
    const b = document.createElement('button');
    b.className = 'rng' + (state.sel === e.id ? ' sel' : '');
    b.style.left = `${l}px`;
    b.style.width = `${Math.max(4, r - l)}px`;
    b.style.top = `${lane * 20}px`;
    b.textContent = r - l > name.length * 7.4 + 14 ? name : '';
    b.title = name;
    b.setAttribute('aria-label', `${name}, ${ageText(e.age)} – ${ageText(e.end)}`);
    b.onclick = () => select(e.id);
    track.append(b);
  }

  const top = rLanes.length * 20 + (rLanes.length ? 4 : 0);
  const pLanes = [];
  const MAXL = 5, GAP = 18;
  for (const e of points) {
    const x = xOf(e.age) * W;
    let lane = pLanes.findIndex((last) => x - last >= GAP);
    if (lane === -1) {
      if (pLanes.length < MAXL) { lane = pLanes.length; pLanes.push(-Infinity); }
      else lane = pLanes.indexOf(Math.min(...pLanes));
    }
    pLanes[lane] = x;
    const name = L(e, 'name');
    const b = document.createElement('button');
    b.className = 'ev' + (e.type === 'extinction' ? ' x' : '') + (state.sel === e.id ? ' sel' : '');
    b.style.left = `${Math.min(Math.max(x, 6), W - 18)}px`;
    b.style.top = `${top + lane * 24}px`;
    b.title = `${name} · ${shortAge(e.age)}`;
    b.setAttribute('aria-label', `${name}, ${ageText(e.age)}`);
    b.onclick = () => select(e.id);
    track.append(b);
  }
  track.style.height = `${top + Math.max(1, pLanes.length) * 24 + 2}px`;
  addExtinctionLines(track);
}

function niceStep(span, target) {
  const raw = span / target, p = 10 ** Math.floor(Math.log10(raw));
  for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * p) return m * p;
  return 10 * p;
}

function drawAxis() {
  const track = $('tax');
  const W = track.clientWidth;
  track.replaceChildren();
  const span = state.from - state.to;
  const step = niceStep(span, Math.max(3, Math.floor(W / 95)));
  const unit = state.from >= 1500 ? 'Ga' : state.from >= 2 ? 'Ma' : 'ka';
  const div = unit === 'Ga' ? 1000 : unit === 'Ma' ? 1 : 0.001;
  const dec = Math.max(0, -Math.floor(Math.log10(step / div) + 1e-9));
  $('unit').textContent = unit;
  $('unit').title = S().unitTitles[unit];
  const first = Math.ceil(state.to / step - 1e-9);
  const last = Math.floor(state.from / step + 1e-9);
  const marks = [state.from];
  for (let i = last; i >= first; i--) if (Math.abs(i * step - state.from) > 1e-9 && Math.abs(i * step - state.to) > 1e-9) marks.push(i * step);
  marks.push(state.to);
  for (let i = 0; i < marks.length - 1; i++) {
    const seg = document.createElement('div');
    seg.className = 'seg-bar' + (i % 2 ? '' : ' dark');
    seg.style.left = pct(xOf(marks[i]));
    seg.style.width = pct(xOf(marks[i + 1]) - xOf(marks[i]));
    track.append(seg);
  }
  for (let i = first; i <= last; i++) {
    const t = i * step, f = xOf(t);
    const lb = document.createElement('div');
    lb.className = 'tlabel';
    lb.textContent = t === 0 ? shortAge(0) : (t / div).toLocaleString(state.lang === 'es' ? 'es-ES' : 'en', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    lb.style.left = pct(f);
    if (f < 0.02) lb.style.transform = 'none';
    if (f > 0.98) lb.style.transform = 'translateX(-100%)';
    track.append(lb);
  }
}

function drawOverview() {
  const bar = $('ovbar');
  bar.replaceChildren();
  for (const u of U.filter((u) => u.rank === 0)) {
    const b = document.createElement('button');
    b.style.left = pct((EARTH - u.start) / EARTH);

function drawPresets() {
  const bar = $('presets');

const isView = (u) => Math.abs(u.start - state.from) < 1e-6 && Math.abs(u.end - state.to) < 1e-6;

function openUnit(u) {
  if (isView(u)) return zoomOut();
  select(u.id);
  zoomTo(u.start, u.end);
}

function zoomOut() {
  const span = state.from - state.to;
  const parent = U.filter((u) => u.start >= state.from - 1e-9 && u.end <= state.to + 1e-9 && u.start - u.end > span + 1e-9)
    .sort((a, b) => (a.start - a.end) - (b.start - b.end))[0];
  parent ? zoomTo(parent.start, parent.end) : zoomTo(EARTH, 0);
}

function drawList() {
  const ol = $('evlist');
  const scroll = ol.scrollTop;
  ol.replaceChildren();
  const list = eventsInView().sort((a, b) => b.age - a.age);
  $('count').textContent = S().count(list.length);

  for (const e of list) {

function crumbsFor(chain) {
  return chain.length ? `<div class="crumbs"><span class="tl">${S().timeLbl}</span>${chain.map((p) => `<button data-go="${p.id}">${L(p, 'name')}</button>`).join('<span>›</span>')}</div>` : '';
}

function taxFor(item) {
  const k = TAX[item.id];
  if (!k) return '';
  const chain = taxChain(k);
  const link = (n) => `<button data-tax="${n.k}">${L(n, 'n')}</button>`;
  let parts;
  if (chain.length <= 3) parts = chain.map(link);
  else if (state.taxOpen) parts = [...chain.map(link), `<button class="more" data-taxtoggle aria-expanded="true">${S().lessLbl}</button>`];
  else parts = [`<button class="more" data-taxtoggle aria-expanded="false" title="${chain.slice(0, -3).map((n) => L(n, 'n')).join(' › ')}">${S().moreLbl(chain.length - 3)}</button>`, ...chain.slice(-3).map(link)];
  return `<div class="crumbs"><span class="tl">${S().taxonomy}</span>${parts.join('<span>›</span>')}</div>`;
}

function revealTree(k) {
  const el = $('treeroot').querySelector(`[data-k="${k}"]`);
  if (!el) return;
  for (let d = el.closest('details'); d; d = d.parentElement.closest('details')) d.open = true;
  const target = el.tagName === 'DETAILS' ? el.querySelector(':scope > summary') : el;
  target.classList.add('hit');
  setTimeout(() => target.classList.remove('hit'), 2000);
  target.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
}

function talkFor(item) {
  const t = L(item, 'talk');
  if (t) return `<div class="talk"><b>${S().talk}</b><span>${t}</span></div>`;
  if (STUDIED.has(item.id)) return `<div class="talk"><b>${S().talk}</b><span>${S().talkDefault}</span></div>`;
  return '';
}

function drawDetail() {
  const el = $('detail');
  const item = byId[state.sel];

    const chain = [];
    for (let p = parentOf(item); p; p = parentOf(p)) chain.unshift(p);

      </div>

        ${kids.length ? `<div class="kind">${s.plural[item.rank + 1]}</div><div class="kids">${kids.map((k) => `<button class="kid" data-go="${k.id}" style="background:${k.color};color:${ink(k.color)}">${L(k, 'name')}</button>`).join('')}</div>` : ''}
      </div>`;
  } else {
    const chain = unitsFor(item);
    el.style.setProperty('--swatch', item.type === 'extinction' ? 'var(--ext)' : 'var(--accent)');
    const at = (a) => (item.approx ? approxText(a) : ageText(a));
    const when = item.type === 'range'
      ? `<div class="fact"><b>${s.from}</b><span>${at(item.age)}</span></div>
         <div class="fact"><b>${s.to}</b><span>${ageText(item.end)}</span></div>
         <div class="fact"><b>${s.clock}</b><span>${clock(item.age)} → ${clock(item.end)}</span></div>`
      : `<div class="fact"><b>${s.when}</b><span>${at(item.age)}</span></div>
         <div class="fact"><b>${s.clock}</b><span>${clock(item.age)}</span></div>`;
    const last = chain[chain.length - 1];
    html = `<div class="dhead">
        <div class="kind">${s.find} ${catNo[item.id]} · ${s.kinds[item.type]}</div>
        <h2>${L(item, 'name')}</h2>
        ${crumbsFor(chain)}
        ${taxFor(item)}
      </div>
      <div class="facts">${when}</div>
      <div class="dbody">
        <p>${L(item, 'desc')}</p>
        ${item.type === 'extinction' ? `<div class="stats">
            <div><b>${s.lost}</b><span>${L(item, 'loss')}</span></div>
            <div><b>${s.cause}</b><span>${L(item, 'cause')}</span></div>
            <div><b>${s.victims}</b><span>${L(item, 'victims')}</span></div>

        ${talkFor(item)}

let anim = 0;
function zoomTo(from, to) {
  cancelAnimationFrame(anim);
  const f0 = state.from, t0 = state.to;
  const done = () => { state.from = from; state.to = to; renderChart(); drawList(); };
  if (reduced) return done();
  const s0 = Math.log(f0 - t0), s1 = Math.log(from - to);
  const c0 = (f0 + t0) / 2, c1 = (from + to) / 2;
  const start = performance.now(), D = 520;
  const step = (now) => {
    let k = Math.min(1, (now - start) / D);
    k = 1 - (1 - k) ** 3;
    const s = Math.exp(s0 + (s1 - s0) * k) / 2, c = c0 + (c1 - c0) * k;
    state.from = c + s; state.to = c - s;
    if (k < 1) { renderChart(); anim = requestAnimationFrame(step); } else done();
  };
  anim = requestAnimationFrame(step);
}

function treeNode(node, path, open) {
  const li = document.createElement('li');

  const when = node.a ? `<button class="when" data-age="${node.a}">~${shortAge(node.a)}</button>` : '<span></span>';
  const desc = `<span class="nd">${L(node, 'd')}</span>`;
  if (node.c) {
    const det = document.createElement('details');
    det.dataset.path = path;
    if (node.k) det.dataset.k = node.k;
    det.open = open ? open.has(path) : path.split('.').length <= 4;
    det.innerHTML = `<summary>${name}${when}${desc}</summary>`;
    const ul = document.createElement('ul');
    node.c.forEach((c, i) => ul.append(treeNode(c, `${path}.${i}`, open)));
    det.append(ul);
    li.append(det);
  } else {
    li.innerHTML = `<div class="leaf"${node.k ? ` data-k="${node.k}"` : ''}>${name}${when}${desc}</div>`;

}

const MIN_SPAN = 0.002;
let frame = 0, listTimer = 0;

function setView(from, to) {
  cancelAnimationFrame(anim);
  let span = Math.min(EARTH, Math.max(MIN_SPAN, from - to));
  from = to + span;
  if (from > EARTH) { from = EARTH; to = EARTH - span; }
  if (to < 0) { to = 0; from = span; }
  state.from = from;
  state.to = to;
  if (!frame) frame = requestAnimationFrame(() => { frame = 0; renderChart(); });
  clearTimeout(listTimer);
  listTimer = setTimeout(drawList, 150);
}

function trackBox() {
  const r = tracks[0].getBoundingClientRect();
  return { left: r.left, width: r.width };
}

function zoomAround(clientX, from0, to0, k) {
  const { left, width } = trackBox();
  const f = Math.min(1, Math.max(0, (clientX - left) / width));
  const span0 = from0 - to0;
  const anchor = from0 - f * span0;
  const span = Math.min(EARTH, Math.max(MIN_SPAN, span0 * k));
  setView(anchor + f * span, anchor + f * span - span);
}

(function navigation() {
  const chart = $('chart');
  const pts = new Map();
  let drag = null, pinch = null, suppress = false;

  chart.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0 || !ev.target.closest('.track')) return;
    suppress = false;
    pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, cx: (a.x + b.x) / 2, from: state.from, to: state.to };
      drag = null;
      return;
    }
    drag = { id: ev.pointerId, x: ev.clientX, y: ev.clientY, from: state.from, to: state.to, active: false };
  });

  chart.addEventListener('pointermove', (ev) => {
    if (!pts.has(ev.pointerId)) return;
    pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pinch && pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      suppress = true;
      zoomAround(pinch.cx, pinch.from, pinch.to, pinch.d0 / d);
      return;
    }
    if (!drag || drag.id !== ev.pointerId) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.active) {
      if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) { drag = null; pts.delete(ev.pointerId); return; }
      if (Math.abs(dx) < 6) return;
      drag.active = true;
      suppress = true;
      chart.classList.add('dragging');
      try { chart.setPointerCapture(ev.pointerId); } catch (e) {}
    }
    const span = drag.from - drag.to;
    const shift = (dx / trackBox().width) * span;
    setView(drag.from + shift, drag.to + shift);
  });

  const end = (ev) => {
    pts.delete(ev.pointerId);
    if (pts.size < 2) pinch = null;
    if (drag && drag.id === ev.pointerId) drag = null;
    chart.classList.remove('dragging');
  };
  chart.addEventListener('pointerup', end);
  chart.addEventListener('pointercancel', end);

  chart.addEventListener('click', (ev) => {
    if (!suppress) return;
    suppress = false;
    ev.stopImmediatePropagation();
    ev.preventDefault();
  }, true);

  chart.addEventListener('wheel', (ev) => {
    if (!ev.target.closest('.track')) return;
    const unit = ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? 400 : 1;
    if (ev.ctrlKey || ev.metaKey) {
      ev.preventDefault();
      zoomAround(ev.clientX, state.from, state.to, Math.exp(ev.deltaY * unit * 0.01));
      return;
    }
    const horizontal = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : ev.shiftKey ? ev.deltaY : 0;
    if (!horizontal) return;
    ev.preventDefault();
    const span = state.from - state.to;
    const shift = -(horizontal * unit / trackBox().width) * span;
    setView(state.from + shift, state.to + shift);
  }, { passive: false });
})();

const TEMP = [[540, 30], [500, 30], [470, 26], [445, 17], [440, 22], [420, 26], [400, 25], [380, 28], [365, 24], [340, 20],
  [310, 15], [290, 16], [270, 22], [252, 34], [245, 30], [220, 26], [200, 27], [180, 25], [150, 22], [120, 24], [92, 30],
  [70, 23], [66, 22], [58, 24], [56, 29], [55, 26], [50, 27], [40, 23], [34, 19], [23, 19], [15, 19], [5, 17], [2.6, 15],
  [0.4, 14], [0.02, 8], [0.0117, 13], [0, 14]];
const O2 = [[4567, 0], [2450, 0], [2300, 2], [2000, 2], [800, 2], [635, 6], [560, 10], [540, 13], [480, 14], [440, 15],
  [420, 16], [400, 17], [360, 21], [330, 28], [300, 33], [280, 30], [260, 24], [250, 17], [230, 15], [200, 17], [150, 22],
  [100, 24], [66, 23], [34, 22], [0, 21]];

function interp(s, a) {
  if (a > s[0][0] || a < s[s.length - 1][0]) return null;
  for (let i = 0; i < s.length - 1; i++) {
    const [a0, v0] = s[i], [a1, v1] = s[i + 1];
    if (a <= a0 && a >= a1) return a0 === a1 ? v0 : v0 + ((v1 - v0) * (a0 - a)) / (a0 - a1);
  }
  return null;
}

function seriesPath(s, W, Y) {
  const pts = [];
  const add = (a, v) => { if (v != null) pts.push(`${(xOf(a) * W).toFixed(1)},${Y(v).toFixed(1)}`); };
  add(state.from, interp(s, state.from));
  s.forEach(([a, v]) => { if (a < state.from && a > state.to) add(a, v); });
  add(state.to, interp(s, state.to));
  return pts.length > 1 ? `M${pts.join('L')}` : '';
}

function drawClimate() {
  const box = $('tclim');
  const W = box.clientWidth, H = box.clientHeight || 96;
  const Y = (v) => H - 4 - (v / 40) * (H - 8);
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  if (state.from > 540) {
    const x1 = Math.min(W, xOf(Math.max(540, state.to)) * W);
    svg += `<rect class="cnone" x="0" y="0" width="${x1.toFixed(1)}" height="${H}"></rect>`;
    if (x1 > 330) svg += `<text class="cnote" x="${(x1 / 2).toFixed(1)}" y="${H / 2 + 20}" text-anchor="middle">${S().climNote}</text>`;
  }
  svg += '<g class="cg">';
  [10, 20, 30].forEach((v) => { svg += `<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}"></line><text x="3" y="${Y(v) - 2}">${v}</text>`; });
  svg += `</g><line class="ctoday" x1="0" x2="${W}" y1="${Y(21)}" y2="${Y(21)}"></line>`;
  svg += `<path class="co" d="${seriesPath(O2, W, Y)}"></path><path class="ct" d="${seriesPath(TEMP, W, Y)}"></path></svg>`;
  box.innerHTML = `${svg}<div class="cv" hidden></div><div class="cread" hidden></div>`;
  addExtinctionLines(box);
}

function climRead(ev) {
  const box = $('tclim');
  const r = box.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
  const a = state.from - f * (state.from - state.to);
  const t = interp(TEMP, a), o = interp(O2, a);
  const v = box.querySelector('.cv'), rd = box.querySelector('.cread');
  if (!v || !rd) return;
  v.hidden = false;
  rd.hidden = false;
  v.style.left = `${f * 100}%`;
  rd.style.left = f > 0.55 ? '4px' : 'auto';
  rd.style.right = f > 0.55 ? 'auto' : '4px';
  rd.textContent = `${shortAge(a)} · ${t != null ? `${nf(t, 0)} °C · ` : ''}${o != null ? `${nf(o, 0)} % O₂` : ''}`;
}

];

const srch = { hits: [], idx: -1 };

function renderSearch() {
  const q = norm($('q').value.trim());
  const ul = $('qres');
  if (!q) { ul.hidden = true; srch.hits = []; return; }
  const starts = [], incl = [];
  SEARCH.forEach((r) => {

    (norm(r.en).startsWith(q) || norm(r.es).startsWith(q) ? starts : incl).push(r);
  });
  srch.hits = [...starts, ...incl].slice(0, 8);
  srch.idx = Math.min(srch.idx, srch.hits.length - 1);
  const s = S();
  const es = state.lang === 'es';
  ul.innerHTML = srch.hits.length ? srch.hits.map((r, i) => {
    const kind = r.kind === 'unit' ? s.ranks[r.o.rank] : r.kind === 'find' ? s.kinds[r.o.type] : s.group;
    const main = es ? r.es : r.en, other = es ? r.en : r.es;
    return `<li><button data-i="${i}" class="${i === srch.idx ? 'on' : ''}"><b>${main}</b><small>${kind}${other !== main ? ` · ${es ? 'EN' : 'ES'}: ${other}` : ''}</small></button></li>`;
  }).join('') : `<li class="none">${s.searchNone}</li>`;

}

const LEAVES = Object.values(NODE).filter((n) => !n.c);
const weakAge = (a) => unitsAt(a).some((u) => WEAK.has(u.id));
const weightOf = (key, weak) => { const it = progress.items[key]; return it ? BOX_W[it.box] : weak ? 8 : 3; };
const quizEvents = () => E.filter((e) => state.study === 'all' || (state.study === 'mine') === STUDIED.has(e.id));
const eventWeight = (e) => weightOf(`e:${e.id}`, weakAge(e.age));
const ageOf = (e) => `${e.approx ? '~' : ''}${shortAge(e.age)}`;
const eraKey = (a) => (a == null ? 'tree' : a > 538.8 ? 'pre' : a > 251.902 ? 'pz' : a > 66 ? 'mz' : 'cz');

function pick(arr, wfn) {
  const ws = arr.map(wfn);
  let r = Math.random() * ws.reduce((t, w) => t + w, 0);
  for (let i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; }
  return arr[arr.length - 1];
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function lcaDepth(x, y) {
  const A = taxChain(x.k), B = new Set(taxChain(y.k));
  let d = 0;
  A.forEach((n, i) => { if (B.has(n)) d = i; });
  return d;
}

function qOrder() {
  const ev = quizEvents();
  if (ev.length < 2) return null;
  const a = pick(ev, eventWeight);
  const dist = (e) => Math.abs(Math.log((e.age + 0.001) / (a.age + 0.001)));
  const near = ev.filter((e) => e !== a && Math.abs(e.age - a.age) > Math.max(0.0005, a.age * 0.01)).sort((x, y) => dist(x) - dist(y)).slice(0, 6);
  if (!near.length) return null;
  const b = near[Math.floor(Math.random() * near.length)];
  const older = a.age > b.age ? a : b;
  return { type: 'order', key: `e:${a.id}`, age: a.age, focus: older.id,
    prompt: () => S().qOrder,
    options: shuffle([a, b]).map((e) => ({ label: () => L(e, 'name'), ok: e === older })),
    explain: () => `${L(a, 'name')}: ${ageOf(a)} · ${L(b, 'name')}: ${ageOf(b)}` };
}

function qPlace() {
  const ev = quizEvents().filter((e) => e.type !== 'range');
  if (!ev.length) return null;
  const e = pick(ev, eventWeight);
  const chain = unitsFor(e).filter((u) => u.rank >= 1);
  const u = chain.find((x) => { const f = (x.start - e.age) / (x.start - x.end); return f > 0.05 && f < 0.95; }) || chain[chain.length - 1] || U[0];
  return { type: 'place', key: `e:${e.id}`, age: e.age, eventId: e.id, unitId: u.id, focus: e.id,
    prompt: () => S().qPlace(L(e, 'name')),
    hint: () => S().qPlaceHint(L(u, 'name')),
    explain: () => `${L(e, 'name')}: ${ageOf(e)}` };
}

function qPeriod() {
  const ev = quizEvents();
  if (!ev.length) return null;
  const e = pick(ev, eventWeight);
  const epoch = e.age < 66 && Math.random() < 0.6;
  const rank = epoch ? 3 : 2;
  const unit = unitsFor(e).find((u) => u.rank === rank);
  if (!unit) return null;
  const same = U.filter((u) => u.rank === rank).sort((a, b) => b.start - a.start);
  const i = same.indexOf(unit);
  const wrong = same.filter((u) => u !== unit).sort((a, b) => Math.abs(same.indexOf(a) - i) - Math.abs(same.indexOf(b) - i)).slice(0, 3);
  return { type: 'period', key: `e:${e.id}`, age: e.age, focus: e.id,
    prompt: () => (epoch ? S().qEpoch : S().qPeriod)(L(e, 'name')),
    options: shuffle([unit, ...wrong]).map((u) => ({ label: () => L(u, 'name'), ok: u === unit })),
    explain: () => `${L(e, 'name')}: ${ageOf(e)} · ${L(unit, 'name')} (${shortAge(unit.start)} – ${shortAge(unit.end)})` };
}

function qGroup() {
  const ev = quizEvents().filter((e) => TAX[e.id]);
  if (!ev.length) return null;
  const e = pick(ev, eventWeight);
  const chain = taxChain(TAX[e.id]);
  const levels = chain.slice(2);
  if (!levels.length) return null;
  const n = levels[Math.floor(Math.random() * levels.length)];
  const parent = NODE[UP[n.k]];
  let pool = (parent.c || []).filter((c) => c !== n);
  const gp = UP[parent.k] ? NODE[UP[parent.k]] : null;
  if (pool.length < 3 && gp) pool = pool.concat((gp.c || []).filter((c) => c !== parent));
  if (!pool.length) return null;
  return { type: 'group', key: `e:${e.id}`, age: e.age, focus: e.id,
    prompt: () => S().qGroup(L(e, 'name')),
    options: shuffle([n, ...shuffle(pool).slice(0, 3)]).map((x) => ({ label: () => L(x, 'n'), ok: x === n })),
    explain: () => chain.map((x) => L(x, 'n')).join(' › ') };
}

function qCloser() {
  const t = pick(LEAVES, (n) => weightOf(`t:${n.k}`, false));
  const others = shuffle(LEAVES.filter((n) => n !== t));
  for (const a of others) {
    for (const b of others) {
      if (a === b) continue;
      const da = lcaDepth(t, a), db = lcaDepth(t, b);
      if (da <= db) continue;
      const ct = taxChain(t.k);
      return { type: 'closer', key: `t:${t.k}`, age: null, tree: t.k,
        prompt: () => S().qCloser(L(t, 'n')),
        options: shuffle([a, b]).map((x) => ({ label: () => L(x, 'n'), ok: x === a })),
        explain: () => S().closerExp(L(t, 'n'), L(a, 'n'), L(ct[da], 'n'), L(b, 'n'), L(ct[db], 'n')) };
    }
  }
  return null;
}

function qMeaning() {
  const pool = U.filter((u) => u.rank >= 2 || ['paleozoic', 'mesozoic', 'cenozoic'].includes(u.id));
  const u = pick(pool, (x) => weightOf(`u:${x.id}`, WEAK.has(x.id)));
  const wrong = shuffle(pool.filter((x) => x !== u && x.rank === u.rank)).slice(0, 3);
  return { type: 'meaning', key: `u:${u.id}`, age: u.start, focus: u.id,
    prompt: () => S().qMeaning(L(u, 'name')),
    options: shuffle([u, ...wrong]).map((x) => ({ label: () => L(x, 'meaning'), ok: x === u })),
    explain: () => L(u, 'desc') };
}

function qTF() {
  const i = pick(STATEMENTS.map((_, n) => n), (n) => weightOf(`s:${n}`, false));
  const st = STATEMENTS[i];
  const f = byId[st.focus];
  return { type: 'tf', key: `s:${i}`, age: f ? (f.age != null ? f.age : f.start) : null, focus: st.focus,
    prompt: () => S().qTF,
    statement: () => st[state.lang],
    options: [true, false].map((v) => ({ label: () => (v ? S().tTrue : S().tFalse), ok: v === st.t })),
    explain: () => st.why[state.lang] };
}

const BUILDERS = [[qOrder, 2], [qPlace, 2], [qPeriod, 2], [qGroup, 1.5], [qCloser, 1], [qMeaning, 1], [qTF, 1]];

function record(q, ok) {
  const it = progress.items[q.key] || { box: 1, seen: 0 };
  it.seen += 1;
  it.box = ok ? Math.min(5, it.box + 1) : 1;
  progress.items[q.key] = it;
  const ek = eraKey(q.age);
  const s = progress.eras[ek] || [0, 0];
  s[1] += 1;
  if (ok) s[0] += 1;
  progress.eras[ek] = s;
  saveProgress();
}

function nextQuestion() {
  let q = null;
  for (let i = 0; i < 12 && !q; i++) q = pick(BUILDERS, (b) => b[1])[0]();
  quiz.q = q;
  quiz.answered = null;
  quiz.resetArm = false;
  state.guess = null;
  state.hide = null;
  if (q && q.type === 'place') {
    state.hide = q.eventId;
    const u = byId[q.unitId];
    zoomTo(u.start, u.end);
    toChart();
  }
  renderChart();
  drawList();
  renderQuiz();
}

function renderQuiz() {
  const p = $('quiz');
  p.hidden = !quiz.open;
  if (!quiz.open) return;
  const s = S(), q = quiz.q, a = quiz.answered;
  const items = Object.values(progress.items);
  const mastered = items.filter((i) => i.box >= 4).length;
  const total = E.length + U.length + LEAVES.length + STATEMENTS.length;
  let html = `<div class="qhead"><b>${s.quizTitle}</b><small>${mastered} ${s.mastered} · ${items.length - mastered} ${s.shaky} · ${Math.max(0, total - items.length)} ${s.unseen}</small><button class="qx" data-q="close" aria-label="${s.close}">×</button></div>`;
  if (!q) {
    html += `<p class="qhint">${s.noQ}</p>`;
  } else {
    html += `<p class="qp">${q.prompt()}</p>`;
    if (q.statement) html += `<p class="qs">${q.statement()}</p>`;
    if (q.hint && !a) html += `<p class="qhint">${q.hint()}</p>`;
    if (q.options) {
      html += `<div class="qopts">${q.options.map((o, i) => {
        const cls = a ? (o.ok ? ' ok' : a.choice === i ? ' bad' : '') : '';
        return `<button class="qopt${cls}" data-opt="${i}"${a ? ' disabled' : ''}>${o.label()}</button>`;
      }).join('')}</div>`;
    }
    if (a) {
      html += `<div class="qfb${a.ok ? '' : ' miss'}"><b>${a.ok ? s.right : s.wrong}</b>`;
      if (q.type === 'place') html += `<span>${s.offBy(durText(a.diff), nf(a.pct, 1))}</span>`;
      html += `<span>${q.explain()}</span></div>`;
      html += `<div class="qact"><button class="go" data-q="next">${s.next}</button>${q.focus || q.tree ? `<button class="go" data-q="show">${s.show}</button>` : ''}</div>`;
    }
  }
  html += `<div class="qbars"><span class="kind">${s.eraAcc}</span>${['pre', 'pz', 'mz', 'cz', 'tree'].map((k) => {
    const [r, t] = progress.eras[k] || [0, 0];
    const pc = t ? Math.round((r / t) * 100) : 0;
    return `<div><span>${s.eraNames[k]}</span><i><em style="width:${pc}%"></em></i><span>${t ? `${pc}%` : '–'}</span></div>`;
  }).join('')}</div>`;
  html += `<div class="qfoot"><small>${s.progressNote}</small><button class="linkish" data-q="reset">${quiz.resetArm ? s.resetConfirm : s.reset}</button></div>`;
  p.innerHTML = html;
}

function openQuiz() {
  quiz.open = true;
  $('quizbtn').setAttribute('aria-pressed', 'true');
  nextQuestion();
}

function closeQuiz() {
  quiz.open = false;
  state.hide = null;
  state.guess = null;
  $('quizbtn').setAttribute('aria-pressed', 'false');
  renderQuiz();
  renderChart();
  drawList();
}

$('quizbtn').onclick = () => (quiz.open ? closeQuiz() : openQuiz());

$('quiz').addEventListener('click', (ev) => {
  const o = ev.target.closest('[data-opt]');
  if (o && quiz.q && !quiz.answered) {
    const i = Number(o.dataset.opt);
    const ok = quiz.q.options[i].ok;
    quiz.answered = { ok, choice: i };
    record(quiz.q, ok);
    renderQuiz();
    return;
  }
  const b = ev.target.closest('[data-q]');
  if (!b) return;
  const act = b.dataset.q;
  if (act === 'close') closeQuiz();
  else if (act === 'next') nextQuestion();
  else if (act === 'show') {
    const q = quiz.q;
    closeQuiz();
    if (q.tree) revealTree(q.tree);
    else if (byId[q.focus].rank !== undefined) showUnit(q.focus);
    else showFind(q.focus);
  } else if (act === 'reset') {
    if (quiz.resetArm) { progress = { items: {}, eras: {} }; saveProgress(); quiz.resetArm = false; } else quiz.resetArm = true;
    renderQuiz();
  }
});

$('chart').addEventListener('click', (ev) => {
  if (!quiz.open || !quiz.q || quiz.q.type !== 'place' || quiz.answered || !ev.target.closest('.track')) return;
  ev.stopImmediatePropagation();
  ev.preventDefault();
  const { left, width } = trackBox();
  const f = Math.min(1, Math.max(0, (ev.clientX - left) / width));
  const span = state.from - state.to;
  const guess = state.from - f * span;
  const e = byId[quiz.q.eventId];
  const diff = Math.abs(guess - e.age);
  const ok = diff <= span * 0.05;
  quiz.answered = { ok, diff, pct: (diff / span) * 100 };
  state.guess = guess;
  state.hide = null;
  record(quiz.q, ok);
  select(e.id);
  renderQuiz();
}, true);

new ResizeObserver(() => renderChart()).observe($('chart'));
applyStatic();
drawDetail();
renderChart();
drawList();
drawTree();
</script>

</body>
</html>
