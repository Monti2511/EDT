<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earth's Deep Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: an excavation record. Survey-grid ground, the timescale as a section drawing with a scale bar, a finds card and finds register below it, then the typology (tree of life). */
:root {
  --hot: #b4532a;
  --o2: #2f6690;
  --bg: #e6dcc6;
  --grid: #d3c6aa;
  --surface: #f3ecdb;
  --fg: #2a2017;
  --muted: #6a5a46;
  --line: #c4b292;
  --accent: #3d6a58;
  --accent-soft: #3d6a5826;
  --ext: #a8321d;
  --display: "Stardos Stencil", "Impact", "Arial Narrow", sans-serif;
  --body: "Alegreya", "Iowan Old Style", Georgia, serif;
  --mono: "Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --hot: #e8875c; --o2: #7fb0dc;
    --bg: #1b1712; --grid: #262019; --surface: #241e18; --fg: #ece2cf; --muted: #a8987f; --line: #3d342a;
    --accent: #7fb59f; --accent-soft: #7fb59f26; --ext: #e66a4f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --hot: #e8875c; --o2: #7fb0dc;
  --bg: #1b1712; --grid: #262019; --surface: #241e18; --fg: #ece2cf; --muted: #a8987f; --line: #3d342a;
  --accent: #7fb59f; --accent-soft: #7fb59f26; --ext: #e66a4f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 48px 48px;
  color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 80px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
header { display: grid; gap: 8px; }
.eyebrow { font-family: var(--mono); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(38px, 7vw, 68px); line-height: .95; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.lede { margin: 2px 0 0; max-width: 66ch; color: var(--muted); }
button { font: inherit; color: inherit; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tag {
  justify-self: start; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  border: 1px solid var(--fg); padding: 2px 8px; background: var(--surface);
}

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 2px; padding: 4px 11px;
  font-family: var(--mono); font-size: 14px; cursor: pointer;
}
.chip:hover { border-color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--surface); }
.chip.out { margin-left: auto; }

.overview { display: grid; gap: 4px; }
.overview .cap { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.ovbar { position: relative; height: 16px; border: 1px solid var(--fg); }
.ovbar button { position: absolute; top: 0; bottom: 0; border: 0; padding: 0; cursor: pointer; }
.ovwin { position: absolute; top: -4px; bottom: -4px; border: 2px solid var(--ext); pointer-events: none; min-width: 4px; }

.chart {
  background: var(--surface); border: 1px solid var(--fg); padding: 12px 14px 12px; display: grid; gap: 4px;
  box-shadow: 4px 4px 0 var(--line);
}
.chart .tag { margin-bottom: 6px; }
.row { display: grid; grid-template-columns: 60px minmax(0, 1fr); align-items: stretch; }
.rlabel { font-family: var(--mono); font-size: 12px; text-transform: uppercase; color: var(--muted); align-self: center; }
.track { position: relative; overflow: hidden; }
.track.bands {
  height: 44px; border-left: 1px solid var(--fg); border-right: 1px solid var(--fg);
  background: repeating-linear-gradient(135deg, transparent 0 5px, var(--line) 5px 6px);
}
.row.r0 .track { height: 52px; border-top: 1px solid var(--fg); }
.row.r3 .track { height: 36px; border-bottom: 1px solid var(--fg); }
.band {
  position: absolute; top: 0; bottom: 0; border: 0; border-right: 1px solid var(--fg); border-bottom: 1px solid rgba(0,0,0,.25); padding: 0 6px;
  font-family: var(--body); font-weight: 700; font-size: 15px; line-height: 1.05; cursor: pointer;
  overflow: hidden; white-space: nowrap; text-overflow: clip; display: flex; align-items: center; justify-content: center;
}
.row.r0 .band { font-family: var(--display); font-weight: 400; font-size: 19px; letter-spacing: .02em; }
.row.r3 .band { font-size: 14px; }
.band:hover { filter: brightness(1.05) saturate(1.1); }
.band.sel { box-shadow: inset 0 0 0 3px var(--fg); }
.xline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--ext); pointer-events: none; z-index: 2; }

.track.events { background: none; margin-top: 8px; }
.chart .track { touch-action: pan-y; cursor: grab; }
.chart.dragging, .chart.dragging * { cursor: grabbing !important; user-select: none; }
.rng {
  position: absolute; height: 16px; border: 1px dashed var(--accent); border-radius: 0; padding: 0 6px; cursor: pointer;
  background: var(--accent-soft); color: var(--fg); font-family: var(--mono); font-size: 12px; line-height: 14px;
  white-space: nowrap; overflow: hidden; text-align: left;
}
.rng.sel { border-style: solid; border-width: 2px; }
.ev { position: absolute; width: 22px; height: 24px; margin-left: -6px; border: 0; padding: 0; background: none; cursor: pointer; z-index: 3; }
.ev::before { content: ""; position: absolute; left: 5px; top: 3px; width: 2px; height: 19px; background: var(--fg); }
.ev::after { content: ""; position: absolute; left: 7px; top: 3px; width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 10px solid var(--accent); }
.ev.x::after { border-left-color: var(--ext); }
.ev.sel::after { border-left-width: 14px; border-top-width: 7px; border-bottom-width: 7px; }
.ev.sel::before { width: 3px; }

.track.axis { height: 30px; margin-top: 6px; }
.seg-bar { position: absolute; top: 0; height: 8px; border: 1px solid var(--fg); }
.seg-bar.dark { background: var(--fg); }
.tlabel { position: absolute; top: 11px; transform: translateX(-50%); font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--mono); font-size: 12px; color: var(--muted); padding-left: 60px; margin-top: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { display: inline-block; }
.lg.flag { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 10px solid var(--accent); }
.lg.flag.x { border-left-color: var(--ext); }
.lg.bar { width: 18px; height: 9px; background: var(--accent-soft); border: 1px dashed var(--accent); }
.lg.line { width: 0; height: 12px; border-left: 2px solid var(--ext); }

.lower { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 760px) { .lower { grid-template-columns: minmax(0, 1fr); } .row { grid-template-columns: 44px minmax(0, 1fr); } .legend { padding-left: 0; } .rlabel { font-size: 10px; } }

.detail { position: relative; background: var(--surface); border: 1px solid var(--fg); box-shadow: 4px 4px 0 var(--line); }
.detail::before {
  content: ""; position: absolute; top: 14px; right: 14px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--fg);
}
.dhead { padding: 16px 44px 14px 20px; border-top: 10px solid var(--swatch, var(--accent)); display: grid; gap: 6px; }
.kind { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.detail h2 { font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1; margin: 0; text-wrap: balance; }
.meaning { font-style: italic; color: var(--muted); margin: 0; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.crumbs button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.crumbs .more { border: 1px dashed var(--accent); padding: 0 6px; text-decoration: none; }
.crumbs .tl { font-size: 11px; text-transform: uppercase; border: 1px solid var(--muted); padding: 0 5px; margin-right: 4px; }
.tree .hit { background: var(--accent-soft); outline: 2px solid var(--accent); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--fg); border-bottom: 1px solid var(--fg); }
.fact { padding: 9px 20px; display: grid; gap: 2px; border-right: 1px dotted var(--muted); }
.fact:last-child { border-right: 0; }
.fact b { font-family: var(--mono); font-size: 12px; font-weight: 400; text-transform: uppercase; color: var(--muted); }
.fact span { font-variant-numeric: tabular-nums; }
.dbody { padding: 14px 20px 20px; display: grid; gap: 12px; }
.dbody p { margin: 0; max-width: 64ch; }
.note { font-size: 15px; color: var(--muted); }
.talk { display: grid; gap: 4px; padding: 10px 14px; border: 1px dashed var(--accent); background: var(--accent-soft); font-size: 16px; }
.talk b, .stats b { font-family: var(--mono); font-size: 12px; font-weight: 400; text-transform: uppercase; color: var(--muted); }
.stats { display: grid; gap: 6px; padding: 12px 14px; border-left: 3px solid var(--ext); background: color-mix(in srgb, var(--ext) 7%, transparent); }
.stats div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; font-size: 16px; }
.stats b { padding-top: 3px; }
.kids { display: flex; flex-wrap: wrap; gap: 6px; }
.kid { border: 1px solid var(--fg); padding: 2px 9px; font-family: var(--body); font-weight: 700; font-size: 15px; cursor: pointer; }
.go { justify-self: start; border: 1px solid var(--fg); background: none; padding: 4px 12px; font-family: var(--mono); font-size: 14px; cursor: pointer; }
.go:hover { background: var(--fg); color: var(--surface); }

.list { background: var(--surface); border: 1px solid var(--fg); box-shadow: 4px 4px 0 var(--line); }
.lhead { padding: 12px 16px 10px; border-bottom: 2px solid var(--fg); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 10px; }
.lhead h3 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; }
.lhead small { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.list ol { list-style: none; margin: 0; padding: 0; max-height: 560px; overflow-y: auto; }
.list li { border-bottom: 1px solid var(--line); }
.list li button {
  width: 100%; display: grid; grid-template-columns: 76px 14px minmax(0, 1fr); gap: 10px; align-items: baseline;
  text-align: left; background: none; border: 0; padding: 6px 16px; cursor: pointer;
}
.list li button:hover { background: var(--accent-soft); }
.list li button.sel { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--fg); }
.age { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.mk { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 9px solid var(--accent); align-self: center; }
.mk.x { border-left-color: var(--ext); }
.mk.r { width: 12px; height: 7px; border: 1px dashed var(--accent); background: var(--accent-soft); }
.empty { padding: 14px 16px; color: var(--muted); margin: 0; }

.tree { background: var(--surface); border: 1px solid var(--fg); box-shadow: 4px 4px 0 var(--line); padding: 16px 20px 20px; display: grid; gap: 12px; }
.tree h2 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; margin: 0; }
.tree > p { margin: 0; max-width: 70ch; color: var(--muted); }
.tree ul { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 1px dotted var(--muted); display: grid; gap: 2px; }
.tree > ul { padding-left: 0; border-left: 0; }
.tree li { min-width: 0; }
.tree summary, .tree .leaf { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 5px 6px 5px 20px; cursor: pointer; position: relative; }
.tree .leaf { cursor: default; }
.tree summary::marker { content: ""; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary::before { content: "+"; position: absolute; left: 4px; top: 5px; font-family: var(--mono); color: var(--muted); }
.tree details[open] > summary::before { content: "−"; }
.tree summary:hover { background: var(--accent-soft); }
.nn { font-weight: 700; font-size: 18px; }
.nn i { font-style: normal; color: var(--ext); margin-left: 4px; }
.nd { grid-column: 1 / -1; font-size: 15px; color: var(--muted); max-width: 72ch; }
.when { border: 1px solid var(--fg); background: none; padding: 0 8px; font-family: var(--mono); font-size: 13px; cursor: pointer; align-self: center; white-space: nowrap; }
.when:hover { background: var(--fg); color: var(--surface); }
footer { font-size: 14px; color: var(--muted); max-width: 80ch; }

.lang {
  display: flex; border: 2px solid var(--fg); background: var(--surface); box-shadow: 3px 3px 0 var(--line);
}
.lang button { border: 0; background: none; padding: 7px 12px; font-family: var(--mono); font-weight: 700; font-size: 15px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
body { margin: 0; }
[hidden] { display: none !important; }
.search { position: relative; max-width: 460px; }
.search input { width: 100%; font-family: var(--mono); font-size: 15px; padding: 8px 10px; border: 2px solid var(--fg); background: var(--surface); color: var(--fg); border-radius: 0; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
#qres { position: absolute; z-index: 15; top: 100%; left: 0; right: 0; margin: 4px 0 0; padding: 0; list-style: none; background: var(--surface); border: 2px solid var(--fg); box-shadow: 4px 4px 0 var(--line); max-height: 60vh; overflow-y: auto; }
#qres button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 7px 10px; display: grid; gap: 1px; cursor: pointer; }
#qres button:hover, #qres button.on { background: var(--accent-soft); }
#qres small { font-family: var(--mono); font-size: 12px; color: var(--muted); }
#qres .none { padding: 8px 10px; color: var(--muted); }
.track.clim { height: 96px; margin-top: 4px; border: 1px solid var(--fg); background: none; }
.track.clim svg { display: block; }
.ct { stroke: var(--hot); stroke-width: 2.2; fill: none; }
.co { stroke: var(--o2); stroke-width: 2.2; fill: none; }
.ctoday { stroke: var(--o2); stroke-width: 1; stroke-dasharray: 2 3; }
.cg line { stroke: var(--line); stroke-width: 1; }
.cg text, .cnote { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.cnone { fill: var(--grid); }
.cv { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--fg); pointer-events: none; z-index: 3; }
.cread { position: absolute; top: 3px; right: 4px; z-index: 4; font-family: var(--mono); font-size: 12px; background: var(--surface); border: 1px solid var(--fg); padding: 0 5px; pointer-events: none; white-space: nowrap; }
.lg.tl1 { width: 18px; height: 0; border-top: 2px solid var(--hot); }
.lg.tl2 { width: 18px; height: 0; border-top: 2px solid var(--o2); }
.guessline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--fg); z-index: 4; pointer-events: none; }
.dock { position: fixed; z-index: 20; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; }
.quizbtn { border: 2px solid var(--fg); background: var(--surface); box-shadow: 3px 3px 0 var(--line); padding: 7px 12px; font-family: var(--mono); font-weight: 700; font-size: 15px; cursor: pointer; }
.quizbtn[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.quiz { position: fixed; z-index: 19; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(68px + env(safe-area-inset-bottom, 0px)); margin-left: auto; max-width: 560px; max-height: 55vh; overflow-y: auto; background: var(--surface); border: 2px solid var(--fg); box-shadow: 4px 4px 0 var(--line); padding: 12px 16px 14px; display: grid; gap: 10px; }
.qhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.qhead b { font-family: var(--display); font-weight: 400; font-size: 24px; }
.qhead small { font-family: var(--mono); font-size: 12px; color: var(--muted); flex: 1; }
.qx { border: 1px solid var(--fg); background: none; width: 30px; height: 30px; cursor: pointer; font-size: 18px; line-height: 1; }
.qp { margin: 0; font-weight: 700; font-size: 18px; }
.qs { margin: 0; font-style: italic; }
.qhint { margin: 0; font-size: 15px; color: var(--muted); }
.qopts { display: grid; gap: 6px; }
.qopt { text-align: left; border: 1px solid var(--fg); background: none; padding: 7px 10px; cursor: pointer; }
.qopt:hover:not([disabled]) { background: var(--accent-soft); }
.qopt.ok { background: var(--accent-soft); border: 2px solid var(--accent); }
.qopt.bad { background: color-mix(in srgb, var(--ext) 12%, transparent); border: 2px solid var(--ext); }
.qopt[disabled] { cursor: default; color: var(--fg); }
.qfb { display: grid; gap: 4px; padding: 8px 12px; border-left: 4px solid var(--accent); background: var(--accent-soft); font-size: 16px; }
.qfb.miss { border-left-color: var(--ext); background: color-mix(in srgb, var(--ext) 8%, transparent); }
.qact { display: flex; flex-wrap: wrap; gap: 8px; }
.qbars { display: grid; gap: 3px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.qbars div { display: grid; grid-template-columns: 120px minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.qbars i { height: 8px; border: 1px solid var(--fg); }
.qbars em { display: block; height: 100%; background: var(--accent); }
.qfoot { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.qfoot small { font-size: 13px; color: var(--muted); }
.linkish { background: none; border: 0; padding: 0; color: var(--ext); text-decoration: underline; cursor: pointer; font-family: var(--mono); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 data-i18n="title"></h1>
    <p class="lede" data-i18n="lede"></p>
  </header>

  <div class="search">
    <input id="q" type="search" autocomplete="off" spellcheck="false">
    <ul id="qres" hidden></ul>
  </div>

  <div class="toolbar" id="presets"></div>

  <div class="overview">
    <div class="cap"><span data-i18n="ovStart"></span><span id="ovtxt"></span><span data-i18n="ovEnd"></span></div>
    <div class="ovbar" id="ovbar"></div>
  </div>

  <section class="chart" id="chart">
    <div class="tag" data-i18n="section"></div>
    <div class="row r0"><div class="rlabel" data-i18n="r0"></div><div class="track bands" id="t0"></div></div>
    <div class="row r1"><div class="rlabel" data-i18n="r1"></div><div class="track bands" id="t1"></div></div>
    <div class="row r2"><div class="rlabel" data-i18n="r2"></div><div class="track bands" id="t2"></div></div>
    <div class="row r3"><div class="rlabel" data-i18n="r3"></div><div class="track bands" id="t3"></div></div>
    <div class="row"><div class="rlabel" data-i18n="rEv"></div><div class="track events" id="tev"></div></div>
    <div class="row"><div class="rlabel" id="unit"></div><div class="track axis" id="tax"></div></div>
    <div class="row"><div class="rlabel" data-i18n="rClim"></div><div class="track clim" id="tclim"></div></div>
    <div class="legend">
      <span><i class="lg flag"></i><span data-i18n="lgEvent"></span></span>
      <span><i class="lg flag x"></i><span data-i18n="lgExt"></span></span>
      <span><i class="lg bar"></i><span data-i18n="lgSpan"></span></span>
      <span><i class="lg line"></i><span data-i18n="lgLine"></span></span>
      <span data-i18n="lgHatch"></span>
      <span><i class="lg tl1"></i><span data-i18n="lgTemp"></span></span>
      <span><i class="lg tl2"></i><span data-i18n="lgO2"></span></span>
      <span data-i18n="lgToday"></span>
      <span data-i18n="lgNav"></span>
    </div>
  </section>

  <div class="lower">
    <article class="detail" id="detail"></article>
    <aside class="list">
      <div class="lhead">
        <h3 data-i18n="register"></h3>

  { id: 'statherian', rank: 2, name: 'Statherian', abbr: 'St', start: 1800, end: 1600, color: '#F875A7', meaning: 'From the Greek statheros, stable',
    desc: 'The supercontinent Columbia (Nuna) is complete and stable. Undisputed fossils of eukaryotic cells appear around its end.',
    es: { name: 'Estatérico', meaning: 'Del griego statheros, estable',
      desc: 'El supercontinente Columbia (Nuna) está completo y estable. Hacia su final aparecen fósiles indiscutibles de células eucariotas.' } },
  { id: 'calymmian', rank: 2, name: 'Calymmian', abbr: 'Cl', start: 1600, end: 1400, color: '#FDC07A', meaning: 'From the Greek kalymma, cover',
    desc: 'Named for the new layers of sediment and volcanic rock that spread over the continents as Columbia begins to break up.',
    es: { name: 'Calímmico', meaning: 'Del griego kalymma, cubierta',
      desc: 'Debe su nombre a las nuevas capas de sedimento y roca volcánica que cubren los continentes cuando Columbia empieza a romperse.' } },
  { id: 'ectasian', rank: 2, name: 'Ectasian', abbr: 'Ec', start: 1400, end: 1200, color: '#F3CC8A', meaning: 'From the Greek ektasis, extension',
    desc: 'Sedimentary covers on the continents keep expanding. Fossil evidence of multicellular algae becomes more common.',
    es: { name: 'Ectásico', meaning: 'Del griego ektasis, extensión',
      desc: 'Las coberturas sedimentarias de los continentes siguen ampliándose. Los fósiles de algas pluricelulares se hacen más frecuentes.' } },
  { id: 'stenian', rank: 2, name: 'Stenian', abbr: 'Sn', start: 1200, end: 1000, color: '#FED99A', meaning: 'From the Greek stenos, narrow',
    desc: 'Named for narrow belts of deformed rock. Collisions such as the Grenville orogeny assemble Rodinia. Bangiomorpha, a red alga, is the oldest known organism with sexual reproduction.',
    es: { name: 'Esténico', meaning: 'Del griego stenos, estrecho',
      desc: 'Debe su nombre a estrechas franjas de roca deformada. Choques como la orogenia de Grenville ensamblan Rodinia. Bangiomorpha, un alga roja, es el organismo más antiguo conocido con reproducción sexual.' } },
  { id: 'tonian', rank: 2, name: 'Tonian', abbr: 'To', start: 1000, end: 720, color: '#FEBF4E', meaning: 'From the Greek tonas, stretch',
    desc: 'Rodinia starts to rift apart. Eukaryotic algae and amoeba-like protists diversify, and the earliest animals, probably sponge-like, may have evolved, although their fossils are disputed.',
    es: { name: 'Tónico', meaning: 'Del griego tonas, estiramiento',
      desc: 'Rodinia empieza a fracturarse. Se diversifican las algas eucariotas y los protistas ameboides, y quizá evolucionan los primeros animales, probablemente parecidos a esponjas, aunque sus fósiles son discutidos.' } },
  { id: 'cryogenian', rank: 2, name: 'Cryogenian', abbr: 'Cr', start: 720, end: 635, color: '#FECC5C', meaning: 'Greek for "cold birth"',
    desc: 'Two global glaciations, the Sturtian and the Marinoan, bring ice close to the equator: the Snowball Earth hypothesis. Life survives under the ice and around volcanic vents.',
    es: { name: 'Criogénico', meaning: 'Del griego, «nacimiento frío»',
      desc: 'Dos glaciaciones globales, la Sturtiana y la Marinoana, llevan el hielo cerca del ecuador: la hipótesis de la Tierra bola de nieve. La vida sobrevive bajo el hielo y junto a fuentes volcánicas.' } },
  { id: 'ediacaran', rank: 2, name: 'Ediacaran', abbr: 'Ed', start: 635, end: 538.8, color: '#FED96A', meaning: 'After the Ediacara Hills, South Australia',
    desc: 'The first large, complex organisms: soft-bodied, quilted forms such as Charnia and Dickinsonia, some a metre long, most unlike anything alive today. They had no eyes, mouths or central nervous systems. Added to the chart in 2004, it was the first new period in more than a century.',
    es: { name: 'Ediacárico', meaning: 'Por las colinas de Ediacara (Australia Meridional)',
      desc: 'Los primeros organismos grandes y complejos: formas blandas y acolchadas como Charnia y Dickinsonia, algunas de un metro, casi todas distintas a cualquier ser vivo actual. No tenían ojos, boca ni sistema nervioso central. Se añadió a la tabla en 2004 y fue el primer periodo nuevo en más de un siglo.' } },

  { id: 'cambrian', rank: 2, name: 'Cambrian', abbr: 'Ꞓ', start: 538.8, end: 486.85, color: '#7FA056', meaning: 'From Cambria, the Latin name for Wales, named by Adam Sedgwick',
    desc: 'Within about 20–25 million years most of the major animal groups appear in the fossil record: the Cambrian explosion. Trilobites, the predator Anomalocaris and the first chordates (our own phylum) swim in the seas. Eyes, shells and hard skeletons appear, and with them predator-prey arms races. The Chengjiang and Burgess Shale fossil beds preserve even soft bodies.',
    es: { name: 'Cámbrico', meaning: 'De Cambria, el nombre latino de Gales; lo bautizó Adam Sedgwick',
      desc: 'En unos 20–25 millones de años aparecen en el registro fósil la mayoría de los grandes grupos animales: la explosión cámbrica. Trilobites, el depredador Anomalocaris y los primeros cordados (nuestro propio filo) nadan en los mares. Surgen ojos, conchas y esqueletos duros, y con ellos la carrera armamentística entre depredador y presa. Los yacimientos de Chengjiang y Burgess Shale conservan incluso cuerpos blandos.' } },
  { id: 'ordovician', rank: 2, name: 'Ordovician', abbr: 'O', start: 486.85, end: 443.1, color: '#009270', meaning: 'After the Ordovices, a Celtic tribe of north Wales',
    desc: 'The Great Ordovician Biodiversification Event multiplies marine life: brachiopods, bryozoans, sponges, early corals, giant straight-shelled nautiloids and the first jawless fish. The first plants, similar to liverworts, reach land. The period ends with a glaciation and the first of the big five mass extinctions.',
    talk: 'Gemini said the Silurian was named to settle a dispute between the Cambrian and the Ordovician. It was the other way round: Sedgwick’s Cambrian and Murchison’s Silurian overlapped, and in 1879 Charles Lapworth named the disputed rocks Ordovician. You also had big coral reefs here; Ordovician reefs were built mostly by sponges and bryozoans, and the large coral reefs came in the Silurian and Devonian.',
    es: { name: 'Ordovícico', meaning: 'Por los ordovicos, una tribu celta del norte de Gales',
      desc: 'La Gran Biodiversificación del Ordovícico multiplica la vida marina: braquiópodos, briozoos, esponjas, primeros corales, nautiloideos gigantes de concha recta y los primeros peces sin mandíbula. Las primeras plantas, parecidas a hepáticas, llegan a tierra. El periodo termina con una glaciación y la primera de las cinco grandes extinciones.',
      talk: 'Gemini dijo que el Silúrico se creó para zanjar una disputa entre el Cámbrico y el Ordovícico. Fue al revés: el Cámbrico de Sedgwick y el Silúrico de Murchison se solapaban, y en 1879 Charles Lapworth llamó Ordovícico a las rocas en disputa. También situabas aquí los grandes arrecifes de coral; los arrecifes ordovícicos los construían sobre todo esponjas y briozoos, y los grandes arrecifes de coral llegaron en el Silúrico y el Devónico.' } },
  { id: 'silurian', rank: 2, name: 'Silurian', abbr: 'S', start: 443.1, end: 419.62, color: '#B3E1B6', meaning: 'After the Silures, a Celtic tribe of south Wales, named by Roderick Murchison in 1835',
    desc: 'Reefs recover after the extinction. Jawed fish appear and diversify, sea scorpions grow to over two metres, and the first vascular plants such as Cooksonia and the first land arthropods take hold on land.',
    talk: 'Your catch: the period of the first jawed fish shares its name with the wels catfish (siluro). Pure coincidence: the period comes from the Celtic Silures, the fish from the Greek silouros.',
    es: { name: 'Silúrico', meaning: 'Por los siluros, una tribu celta del sur de Gales; lo bautizó Roderick Murchison en 1835',
      desc: 'Los arrecifes se recuperan tras la extinción. Aparecen y se diversifican los peces con mandíbula, los escorpiones marinos superan los dos metros, y las primeras plantas vasculares como Cooksonia y los primeros artrópodos terrestres se asientan en tierra.',
      talk: 'Tu hallazgo: el periodo de los primeros peces con mandíbula comparte nombre con el pez siluro. Pura coincidencia: el periodo viene de los siluros celtas y el pez del griego silouros.' } },
  { id: 'devonian', rank: 2, name: 'Devonian', abbr: 'D', start: 419.62, end: 358.86, color: '#CB8C37', meaning: 'After Devon, England',
    desc: 'The age of fishes: armoured placoderms such as Dunkleosteus, sharks and lobe-finned fish. The first trees, forests and seeds appear, and four-limbed vertebrates (tetrapods) evolve from lobe-finned fish. A series of extinctions late in the period devastates reefs.',
    talk: 'You linked tree roots, phosphorus, algal blooms, oxygen-starved water and fish crawling out, and the order was right: this is the Devonian plant hypothesis of Algeo and Scheckler.',
    es: { name: 'Devónico', meaning: 'Por Devon (Inglaterra)',
      desc: 'La edad de los peces: placodermos acorazados como Dunkleosteus, tiburones y peces de aletas lobuladas. Aparecen los primeros árboles, bosques y semillas, y los vertebrados de cuatro patas (tetrápodos) evolucionan a partir de peces de aletas lobuladas. Una serie de extinciones al final del periodo arrasa los arrecifes.',
      talk: 'Enlazaste raíces de árboles, fósforo, proliferación de algas, aguas sin oxígeno y peces saliendo del agua, y el orden era correcto: es la hipótesis de las plantas del Devónico de Algeo y Scheckler.' } },
  { id: 'carboniferous', rank: 2, name: 'Carboniferous', abbr: 'C', start: 358.86, end: 298.9, color: '#67A599', meaning: 'Latin for "coal-bearing"',
    desc: 'Vast swamp forests of giant clubmosses such as Lepidodendron and Sigillaria become the world’s coal deposits. Oxygen reaches about 35%, allowing giant insects such as the dragonfly-like Meganeura. The first amniotes lay shelled eggs, freeing vertebrates from the water.',
    talk: 'You asked why coal waited for the Carboniferous when the Devonian already had forests. Wet equatorial basins forming as Pangaea assembled, and bark rich in lignin, made a burial machine. The idea that fungi could not yet digest lignin is popular but contested: a 2016 study argued climate and tectonics explain most of the coal.',
    es: { name: 'Carbonífero', meaning: 'Del latín, «portador de carbón»',
      desc: 'Inmensos bosques pantanosos de licopodios gigantes como Lepidodendron y Sigillaria se convierten en los yacimientos de carbón del mundo. El oxígeno llega a cerca del 35 %, lo que permite insectos gigantes como Meganeura, parecida a una libélula. Los primeros amniotas ponen huevos con cáscara y liberan a los vertebrados del agua.',
      talk: 'Preguntaste por qué el carbón esperó al Carbonífero si el Devónico ya tenía bosques. Las cuencas ecuatoriales húmedas que se formaban al ensamblarse Pangea, y una corteza rica en lignina, crearon una máquina de enterramiento. La idea de que los hongos aún no podían digerir la lignina es popular pero discutida: un estudio de 2016 defendió que el clima y la tectónica explican la mayor parte del carbón.' } },
  { id: 'permian', rank: 2, name: 'Permian', abbr: 'P', start: 298.9, end: 251.902, color: '#F04028', meaning: 'After the region of Perm, Russia, named by Murchison',
    desc: 'Pangaea is fully assembled, with a dry interior. Synapsids, the group that leads to mammals, dominate the land: first sail-backed Dimetrodon, then therapsids. Armoured pareiasaurs graze. It ends with the Great Dying, the worst mass extinction known.',
    talk: 'You flagged the Permian as a weak spot: think "the giant desert". Pangaea, our synapsid ancestors on top, and an end by Siberian volcanoes.',
    es: { name: 'Pérmico', meaning: 'Por la región de Perm (Rusia); lo bautizó Murchison',
      desc: 'Pangea está completamente formada, con un interior seco. Los sinápsidos, el grupo que lleva a los mamíferos, dominan la tierra: primero Dimetrodon con su vela, después los terápsidos. Los pareiasaurios acorazados pastan. Termina con la Gran Mortandad, la peor extinción conocida.',
      talk: 'Señalaste el Pérmico como punto débil: piensa en «el desierto gigante». Pangea, nuestros antepasados sinápsidos en la cima y un final por los volcanes de Siberia.' } },
  { id: 'triassic', rank: 2, name: 'Triassic', abbr: 'T', start: 251.902, end: 201.4, color: '#812B92', meaning: 'From Trias, three rock layers in Germany, named by Friedrich von Alberti',
    desc: 'Life recovers slowly from the Permian extinction. The first dinosaurs, pterosaurs, turtles, ichthyosaurs and mammals appear. Crocodile-line reptiles rule the land until another extinction at the end of the period clears the way for the dinosaurs.',
    es: { name: 'Triásico', meaning: 'De Trias, tres capas de roca en Alemania; lo bautizó Friedrich von Alberti',
      desc: 'La vida se recupera despacio de la extinción del Pérmico. Aparecen los primeros dinosaurios, pterosaurios, tortugas, ictiosaurios y mamíferos. Los reptiles de la línea de los cocodrilos dominan la tierra hasta que otra extinción al final del periodo deja vía libre a los dinosaurios.' } },
  { id: 'jurassic', rank: 2, name: 'Jurassic', abbr: 'J', start: 201.4, end: 143.1, color: '#34B2C9', meaning: 'After the Jura Mountains, between France and Switzerland',
    desc: 'Dinosaurs dominate: giant sauropods like Brachiosaurus, plated Stegosaurus and the predator Allosaurus. Pangaea splits into Laurasia and Gondwana and the Atlantic begins to open. Archaeopteryx and other feathered dinosaurs show birds evolving. The boundary with the Cretaceous has no mass extinction and is one of the few without an agreed golden spike.',
    es: { name: 'Jurásico', meaning: 'Por las montañas del Jura, entre Francia y Suiza',
      desc: 'Dominan los dinosaurios: saurópodos gigantes como Brachiosaurus, Stegosaurus con sus placas y el depredador Allosaurus. Pangea se divide en Laurasia y Gondwana y el Atlántico empieza a abrirse. Archaeopteryx y otros dinosaurios con plumas muestran la evolución de las aves. Su límite con el Cretácico no tiene extinción masiva y es de los pocos sin clavo de oro acordado.' } },
  { id: 'cretaceous', rank: 2, name: 'Cretaceous', abbr: 'K', start: 143.1, end: 66, color: '#7FC64E', meaning: 'From the Latin creta, chalk, like the white cliffs of Dover',
    desc: 'The longest Phanerozoic period. Flowering plants spread with pollinating insects. Tyrannosaurus, Triceratops and huge marine reptiles live in its last stage. Mammals split into monotremes, marsupials and placentals. It ends with the Chicxulub asteroid impact.',
    es: { name: 'Cretácico', meaning: 'Del latín creta, tiza, como los acantilados blancos de Dover',
      desc: 'El periodo más largo del Fanerozoico. Las plantas con flores se extienden con los insectos polinizadores. Tyrannosaurus, Triceratops y enormes reptiles marinos viven en su última etapa. Los mamíferos se dividen en monotremas, marsupiales y placentarios. Termina con el impacto del asteroide de Chicxulub.' } },
  { id: 'paleogene', rank: 2, name: 'Paleogene', abbr: 'Pg', start: 66, end: 23.04, color: '#FD9A52', meaning: 'Greek for "ancient-born"',
    desc: 'Mammals radiate fast: the first primates, bats, horses, and whales returning to the sea. A sharp hothouse spike (the PETM) is followed by long cooling, and an ice sheet forms on Antarctica.',
    es: { name: 'Paleógeno', meaning: 'Del griego, «nacido antiguo»',
      desc: 'Los mamíferos se diversifican deprisa: los primeros primates, murciélagos, caballos y ballenas que vuelven al mar. A un brusco pico de calor (el PETM) le sigue un largo enfriamiento, y se forma un casquete de hielo en la Antártida.' } },
  { id: 'neogene', rank: 2, name: 'Neogene', abbr: 'N', start: 23.04, end: 2.58, color: '#FFE619', meaning: 'Greek for "new-born"',
    desc: 'Grasslands spread, and grazing animals with high-crowned teeth with them. Africa joins Eurasia, apes diversify, and the first hominins appear in Africa. The Isthmus of Panama closes and joins the Americas.',
    talk: 'Paleogene and Neogene replaced the old "Tertiary". Your summary: the Neogene is the switch from a green forest world to a yellow savanna world.',
    es: { name: 'Neógeno', meaning: 'Del griego, «nacido nuevo»',
      desc: 'Se extienden las praderas y con ellas los herbívoros de dientes de corona alta. África se une a Eurasia, los simios se diversifican y aparecen los primeros homininos en África. Se cierra el istmo de Panamá y une las Américas.',
      talk: 'Paleógeno y Neógeno sustituyeron al antiguo «Terciario». Tu resumen: el Neógeno es el paso de un mundo verde de bosque a un mundo amarillo de sabana.' } },
  { id: 'quaternary', rank: 2, name: 'Quaternary', abbr: 'Q', start: 2.58, end: 0, color: '#F9F97F', meaning: 'Latin for "fourth", from Arduino’s 1759 Primary–Secondary–Tertiary scheme',
    desc: 'Ice ages come and go in cycles of about 100,000 years. The genus Homo spreads out of Africa, Homo sapiens evolves, and many large mammals such as mammoths die out.',
    talk: 'You asked why "fourth" when it has only two epochs. The name is the fourth floor of an 18th-century scheme, not a count; it survived because the onset of the ice ages is such a useful boundary.',
    es: { name: 'Cuaternario', meaning: 'Del latín, «cuarto», por el esquema Primario–Secundario–Terciario de Arduino (1759)',
      desc: 'Las glaciaciones van y vienen en ciclos de unos 100.000 años. El género Homo sale de África, evoluciona Homo sapiens y muchos grandes mamíferos como los mamuts se extinguen.',
      talk: 'Preguntaste por qué «cuarto» si solo tiene dos épocas. El nombre es el cuarto piso de un esquema del siglo XVIII, no un recuento; sobrevivió porque el inicio de las glaciaciones es un límite muy útil.' } },

  { id: 'paleocene', rank: 3, name: 'Paleocene', abbr: 'Pc', start: 66, end: 56, color: '#FDA75F', meaning: 'Greek for "old recent"',
    desc: 'The world recovers from the impact. Mammals, mostly small generalists, multiply into the empty niches, and the earliest primate relatives (plesiadapiforms) appear.',
    es: { name: 'Paleoceno', meaning: 'Del griego, «antiguo reciente»',
      desc: 'El mundo se recupera del impacto. Los mamíferos, en su mayoría pequeños y generalistas, ocupan los nichos vacíos, y aparecen los primeros parientes de los primates (plesiadapiformes).' } },
  { id: 'eocene', rank: 3, name: 'Eocene', abbr: 'Eo', start: 56, end: 33.9, color: '#FDB46C', meaning: 'Greek for "dawn of the recent"',
    desc: 'It opens with the PETM heat spike; forests reach the poles. Most modern mammal orders appear, and whales move from land into the sea. It ends with sharp cooling as Antarctica freezes over.',
    es: { name: 'Eoceno', meaning: 'Del griego, «amanecer de lo reciente»',
      desc: 'Empieza con el pico de calor del PETM; los bosques llegan a los polos. Aparecen la mayoría de los órdenes modernos de mamíferos y las ballenas pasan de la tierra al mar. Termina con un enfriamiento brusco cuando la Antártida se congela.' } },
  { id: 'oligocene', rank: 3, name: 'Oligocene', abbr: 'Ol', start: 33.9, end: 23.04, color: '#FEC07A', meaning: 'Greek for "few recent"',
    desc: 'A cooler, drier world with a permanent Antarctic ice sheet. Open woodland spreads, toothed and baleen whales go their separate ways, and Paraceratherium becomes the largest land mammal ever.',
    es: { name: 'Oligoceno', meaning: 'Del griego, «poco reciente»',
      desc: 'Un mundo más fresco y seco con un casquete antártico permanente. Se extienden los bosques abiertos, los cetáceos con dientes y con barbas siguen caminos distintos, y Paraceratherium se convierte en el mayor mamífero terrestre de la historia.' } },
  { id: 'miocene', rank: 3, name: 'Miocene', abbr: 'Mi', start: 23.04, end: 5.333, color: '#FFFF00', meaning: 'Greek for "less recent"',
    desc: 'The empire of grass. Horses and ruminants evolve high-crowned teeth for gritty grass, apes diversify in Africa and Eurasia, and Megalodon hunts in the oceans.',
    es: { name: 'Mioceno', meaning: 'Del griego, «menos reciente»',
      desc: 'El imperio de la hierba. Caballos y rumiantes desarrollan dientes de corona alta para la hierba abrasiva, los simios se diversifican en África y Eurasia, y el megalodón caza en los océanos.' } },
  { id: 'pliocene', rank: 3, name: 'Pliocene', abbr: 'Pl', start: 5.333, end: 2.58, color: '#FFFF99', meaning: 'Greek for "more recent"',
    desc: 'The Isthmus of Panama closes, setting off the Great American Biotic Interchange. Cooling accelerates, and in Africa Australopithecus walks upright.',
    es: { name: 'Plioceno', meaning: 'Del griego, «más reciente»',
      desc: 'Se cierra el istmo de Panamá y arranca el Gran Intercambio Biótico Americano. El enfriamiento se acelera y en África Australopithecus camina erguido.' } },
  { id: 'pleistocene', rank: 3, name: 'Pleistocene', abbr: 'Ps', start: 2.58, end: 0.0117, color: '#FFF2AE', meaning: 'Greek for "most recent"',
    desc: 'The ice age: repeated glaciations, mammoths, woolly rhinos and sabre-toothed cats. The genus Homo learns to control fire and spreads across the world; at the end much of the megafauna disappears.',
    es: { name: 'Pleistoceno', meaning: 'Del griego, «el más reciente»',
      desc: 'La edad de hielo: glaciaciones repetidas, mamuts, rinocerontes lanudos y tigres dientes de sable. El género Homo aprende a controlar el fuego y se extiende por el mundo; al final desaparece gran parte de la megafauna.' } },
  { id: 'holocene', rank: 3, name: 'Holocene', abbr: 'Ho', start: 0.0117, end: 0, color: '#FEF2E0', meaning: 'Greek for "wholly recent"',
    desc: 'The warm interval since the last glaciation. Farming, cities and all of written history fit inside it.',
    talk: 'On the Anthropocene debate you discussed: in March 2024 the International Union of Geological Sciences rejected it as a formal epoch, so the Holocene is still the current one. "Anthropocene" stays in use as an informal term.',
    es: { name: 'Holoceno', meaning: 'Del griego, «totalmente reciente»',
      desc: 'El intervalo cálido desde la última glaciación. La agricultura, las ciudades y toda la historia escrita caben en él.',
      talk: 'Sobre el debate del Antropoceno que comentaste: en marzo de 2024 la Unión Internacional de Ciencias Geológicas lo rechazó como época formal, así que el Holoceno sigue siendo la época actual. «Antropoceno» se sigue usando como término informal.' } },
];

const E = [
  { id: 'earth', name: 'Earth forms', age: 4567, type: 'event',
    desc: 'The oldest solids in the solar system date to 4.567 billion years ago, and Earth grows from colliding planetesimals within the next few tens of millions of years.',
    es: { name: 'Se forma la Tierra', desc: 'Los sólidos más antiguos del sistema solar datan de hace 4.567 millones de años, y la Tierra crece a partir de planetesimales que chocan en las siguientes decenas de millones de años.' } },
  { id: 'moon', name: 'Moon-forming impact', age: 4510, approx: true, type: 'event',
    desc: 'A Mars-sized body, often called Theia, strikes the young Earth. The debris thrown into orbit gathers into the Moon.',
    es: { name: 'Impacto que forma la Luna', desc: 'Un cuerpo del tamaño de Marte, a menudo llamado Tea (Theia), golpea a la joven Tierra. Los restos lanzados a la órbita se reúnen en la Luna.' } },
  { id: 'zircon', name: 'Oldest known mineral', age: 4404, type: 'event',
    desc: 'A zircon crystal from the Jack Hills of Western Australia. Zircon takes in uranium but rejects lead when it forms, so all its lead comes from radioactive decay, which makes it a precise clock. Its chemistry suggests continental crust and liquid water already existed.',
    es: { name: 'Mineral más antiguo conocido', desc: 'Un cristal de circón de Jack Hills (Australia Occidental). El circón incorpora uranio pero rechaza el plomo al formarse, así que todo su plomo procede de la desintegración radiactiva, lo que lo convierte en un reloj preciso. Su química sugiere que ya existían corteza continental y agua líquida.' } },
  { id: 'acasta', name: 'Oldest dated rock', age: 4031, type: 'event',
    desc: 'The Acasta Gneiss in northern Canada. Its age is used as the base of the Archean on the chart.',
    es: { name: 'Roca datada más antigua', desc: 'El gneis de Acasta, en el norte de Canadá. Su edad marca la base del Arcaico en la tabla.' } },
  { id: 'stromatolites', name: 'Oldest accepted fossils', age: 3480, approx: true, type: 'event',
    desc: 'Stromatolites in the Dresser Formation, Pilbara, Western Australia: mounds built by microbial mats. Older claims, at 3.7 and even 4.1 billion years, are still debated.',
    es: { name: 'Fósiles aceptados más antiguos', desc: 'Estromatolitos de la Formación Dresser (Pilbara, Australia Occidental): montículos construidos por tapetes microbianos. Las propuestas más antiguas, de 3.700 e incluso 4.100 millones de años, siguen en debate.' } },
  { id: 'goe', name: 'Great Oxidation Event', age: 2430, end: 2060, approx: true, type: 'range',
    desc: 'Oxygen made by cyanobacteria finally accumulates in the atmosphere. It probably wiped out many anaerobic microbes and triggered the Huronian glaciation by removing methane from the air.',
    es: { name: 'Gran Oxidación', desc: 'El oxígeno de las cianobacterias por fin se acumula en la atmósfera. Probablemente acabó con muchos microbios anaerobios y desencadenó la glaciación huroniana al eliminar metano del aire.' } },
  { id: 'eukaryotes', name: 'First undisputed eukaryotes', age: 1650, approx: true, type: 'event',
    desc: 'Microfossils of cells with complex internal structure, the group that later includes all animals, plants and fungi.',
    es: { name: 'Primeros eucariotas indiscutibles', desc: 'Microfósiles de células con estructura interna compleja, el grupo que después incluirá a todos los animales, plantas y hongos.' } },
  { id: 'bangiomorpha', name: 'First sexual reproduction', age: 1047, approx: true, type: 'event',
    desc: 'Bangiomorpha, a red alga from Arctic Canada, is the oldest known multicellular organism with sexual reproduction.',
    es: { name: 'Primera reproducción sexual', desc: 'Bangiomorpha, un alga roja del Ártico canadiense, es el organismo pluricelular más antiguo conocido con reproducción sexual.' } },
  { id: 'snowball', name: 'Snowball Earth', age: 717, end: 635, approx: true, type: 'range',
    desc: 'The Sturtian (717–660 million years ago) and Marinoan (about 650–635) glaciations, when ice sheets reached the tropics and may have covered almost the whole planet.',
    es: { name: 'Tierra bola de nieve', desc: 'Las glaciaciones Sturtiana (hace 717–660 millones de años) y Marinoana (hace unos 650–635), cuando los casquetes de hielo llegaron a los trópicos y quizá cubrieron casi todo el planeta.' } },
  { id: 'ediacara', name: 'Ediacaran biota appears', age: 574, approx: true, type: 'event',
    desc: 'The first large, complex organisms, preserved at Mistaken Point in Newfoundland: frond-like rangeomorphs living on the deep sea floor. They absorbed food from the water or grazed microbial mats, and had no eyes, mouths or brains.',
    talk: 'You asked whether the "garden of Ediacara" came before brains, in the Devonian. It is about 150 million years before the Devonian, before even the Cambrian.',
    es: { name: 'Aparece la biota de Ediacara', desc: 'Los primeros organismos grandes y complejos, conservados en Mistaken Point (Terranova): rangeomorfos en forma de fronda que vivían en el fondo marino profundo. Absorbían alimento del agua o pastaban tapetes microbianos, y no tenían ojos, boca ni cerebro.',
      talk: 'Preguntaste si el «jardín de Ediacara» fue antes de los cerebros, en el Devónico. Está unos 150 millones de años antes del Devónico, antes incluso del Cámbrico.' } },
  { id: 'dickinsonia', name: 'Dickinsonia', age: 558, approx: true, type: 'event',
    desc: 'A flat, oval creature up to 1.4 metres across. Cholesterol molecules preserved in its fossils showed in 2018 that it was an animal.',
    es: { name: 'Dickinsonia', desc: 'Un ser plano y ovalado de hasta 1,4 metros. Las moléculas de colesterol conservadas en sus fósiles demostraron en 2018 que era un animal.' } },
  { id: 'cambrianexp', name: 'Cambrian explosion', age: 538.8, end: 515, approx: true, type: 'range',
    desc: 'Most major animal body plans appear in the fossil record in a geologically short time. Likely drivers include rising oxygen, the evolution of predation and eyes, and new ecological niches.',
    es: { name: 'Explosión cámbrica', desc: 'La mayoría de los grandes planes corporales animales aparecen en el registro fósil en poco tiempo geológico. Entre las causas probables: el aumento del oxígeno, la evolución de la depredación y de los ojos, y nuevos nichos ecológicos.' } },
  { id: 'chengjiang', name: 'Chengjiang biota', age: 518, type: 'event',
    desc: 'A fossil site in Yunnan, China, with exquisitely preserved soft-bodied animals, including some of the earliest vertebrates such as Haikouichthys.',
    es: { name: 'Biota de Chengjiang', desc: 'Un yacimiento de Yunnan (China) con animales de cuerpo blando conservados de forma exquisita, incluidos algunos de los primeros vertebrados como Haikouichthys.' } },
  { id: 'burgess', name: 'Burgess Shale', age: 508, type: 'event',
    desc: 'A fossil bed in the Canadian Rockies with Anomalocaris, Opabinia, Hallucigenia and the early chordate Pikaia.',
    es: { name: 'Burgess Shale', desc: 'Un yacimiento de las Rocosas canadienses con Anomalocaris, Opabinia, Hallucigenia y el cordado primitivo Pikaia.' } },
  { id: 'gobe', name: 'Great Ordovician Biodiversification', age: 485, end: 445, approx: true, type: 'range',
    desc: 'The number of marine animal families roughly triples, building the ecosystems that last for the rest of the Paleozoic.',
    es: { name: 'Gran Biodiversificación del Ordovícico', desc: 'El número de familias de animales marinos casi se triplica y se construyen los ecosistemas que durarán el resto del Paleozoico.' } },
  { id: 'landplants', name: 'First land plants', age: 470, approx: true, type: 'event',
    desc: 'Fossil spores from plants similar to liverworts: the start of the greening of the continents.',
    es: { name: 'Primeras plantas terrestres', desc: 'Esporas fósiles de plantas parecidas a las hepáticas: el comienzo del reverdecimiento de los continentes.' } },
  { id: 'nautiloids', name: 'Giant nautiloids', age: 460, approx: true, type: 'event',
    desc: 'Straight-shelled cephalopods such as Endoceras, relatives of squid, reach several metres long and are the top predators of Ordovician seas.',
    es: { name: 'Nautiloideos gigantes', desc: 'Cefalópodos de concha recta como Endoceras, parientes de los calamares, alcanzan varios metros y son los superdepredadores de los mares ordovícicos.' } },
  { id: 'endord', name: 'End-Ordovician extinction', age: 443.1, type: 'extinction', loss: 'About 85% of species',
    cause: 'A rapid glaciation over the southern supercontinent Gondwana dropped sea levels and cooled the oceans, followed by a second pulse as the ice melted.',
    victims: 'Brachiopods, trilobites, graptolites, conodonts and reef-builders.',
    desc: 'The first of the big five. Almost all life was still in the sea, so shallow-water habitats draining away was devastating.',
    talk: 'Gemini blamed the glaciation on early land plants drawing down carbon dioxide. That is one hypothesis; the weathering of newly raised mountains is another, and the cause is still debated.',
    es: { name: 'Extinción del final del Ordovícico', loss: 'Cerca del 85 % de las especies',
      cause: 'Una rápida glaciación sobre el supercontinente austral Gondwana hizo bajar el nivel del mar y enfrió los océanos, seguida de un segundo pulso al fundirse el hielo.',
      victims: 'Braquiópodos, trilobites, graptolitos, conodontos y constructores de arrecifes.',
      desc: 'La primera de las cinco grandes. Casi toda la vida seguía en el mar, así que la desaparición de los hábitats someros fue devastadora.',
      talk: 'Gemini atribuyó la glaciación a que las primeras plantas terrestres retiraron dióxido de carbono. Es una hipótesis; otra es la meteorización de cordilleras recién levantadas, y la causa sigue en debate.' } },
  { id: 'cooksonia', name: 'First vascular plants', age: 433, approx: true, type: 'event',
    desc: 'Cooksonia, a few centimetres tall, with water-conducting tissue and spore capsules on forked stems. Lignin, the molecule that stiffens wood, lets plants stand up out of the water.',
    es: { name: 'Primeras plantas vasculares', desc: 'Cooksonia, de pocos centímetros, con tejido conductor de agua y cápsulas de esporas en tallos bifurcados. La lignina, la molécula que da rigidez a la madera, permite a las plantas erguirse fuera del agua.' } },
  { id: 'jaws', name: 'First jawed fish', age: 436, approx: true, type: 'event',
    desc: 'Fossils from China such as Xiushanosteus show jawed vertebrates by the early Silurian. Jaws evolved from the front pair of gill arches.',
    es: { name: 'Primeros peces con mandíbula', desc: 'Fósiles de China como Xiushanosteus muestran vertebrados con mandíbula a comienzos del Silúrico. Las mandíbulas evolucionaron a partir del primer par de arcos branquiales.' } },
  { id: 'landanimals', name: 'Earliest land animals', age: 425, approx: true, type: 'event',
    desc: 'Millipedes such as Pneumodesmus, with breathing holes for air. The dating of the oldest specimens is debated.',
    talk: 'You had animals reaching land in the Devonian. Invertebrates (millipedes, early arachnids) came first, in the Silurian; vertebrates followed in the Devonian.',
    es: { name: 'Primeros animales terrestres', desc: 'Milpiés como Pneumodesmus, con orificios para respirar aire. La datación de los ejemplares más antiguos es discutida.',
      talk: 'Situabas la llegada de los animales a tierra en el Devónico. Primero llegaron los invertebrados (milpiés, primeros arácnidos), en el Silúrico; los vertebrados los siguieron en el Devónico.' } },
  { id: 'forests', name: 'First forests', age: 385, approx: true, type: 'event',
    desc: 'Fossil tree stumps at Gilboa and Cairo, New York, and trees like Archaeopteris. Their deep roots broke up rock and released phosphorus into rivers and seas.',
    es: { name: 'Primeros bosques', desc: 'Tocones fósiles de Gilboa y Cairo (Nueva York) y árboles como Archaeopteris. Sus raíces profundas rompían la roca y liberaban fósforo hacia ríos y mares.' } },
  { id: 'tiktaalik', name: 'Tiktaalik', age: 375, approx: true, type: 'event',
    desc: 'A lobe-finned fish with a neck, sturdy fins and lungs: an intermediate between fish and the first tetrapods, found in Arctic Canada in 2004.',
    es: { name: 'Tiktaalik', desc: 'Un pez de aletas lobuladas con cuello, aletas robustas y pulmones: un intermedio entre los peces y los primeros tetrápodos, hallado en el Ártico canadiense en 2004.' } },
  { id: 'latedev', name: 'Late Devonian extinctions', age: 372, type: 'extinction', loss: 'About 75% of species',
    cause: 'Repeated episodes of oxygen loss in the oceans. One leading hypothesis: new forests released nutrients such as phosphorus, causing algal blooms whose decay used up the oxygen. The main pulses were the Kellwasser event (372 million years ago) and the Hangenberg event (359).',
    victims: 'Reef-building corals and sponges, many trilobites and armoured fish; placoderms died out by the end.',
    desc: 'More a series of crises spread over millions of years than a single event. Reefs took over 100 million years to fully recover.',
    talk: 'Your phosphorus-and-anoxia chain is the Algeo and Scheckler hypothesis, and it matches the order of events.',
    es: { name: 'Extinciones del Devónico tardío', loss: 'Cerca del 75 % de las especies',
      cause: 'Episodios repetidos de pérdida de oxígeno en los océanos. Una hipótesis destacada: los nuevos bosques liberaron nutrientes como el fósforo, provocando proliferaciones de algas cuya descomposición agotó el oxígeno. Los pulsos principales fueron el evento Kellwasser (hace 372 millones de años) y el Hangenberg (359).',
      victims: 'Corales y esponjas constructores de arrecifes, muchos trilobites y peces acorazados; los placodermos desaparecieron al final.',
      desc: 'Más una serie de crisis repartidas en millones de años que un único evento. Los arrecifes tardaron más de 100 millones de años en recuperarse del todo.',
      talk: 'Tu cadena de fósforo y anoxia es la hipótesis de Algeo y Scheckler, y encaja con el orden de los acontecimientos.' } },
  { id: 'tetrapods', name: 'First tetrapods', age: 365, approx: true, type: 'event',
    desc: 'Acanthostega and Ichthyostega, with limbs and digits, still mostly living in water. Fossil trackways in Poland suggest tetrapods existed as early as 395 million years ago.',
    es: { name: 'Primeros tetrápodos', desc: 'Acanthostega e Ichthyostega, con patas y dedos, aún muy ligados al agua. Unas huellas fósiles en Polonia sugieren tetrápodos ya hace 395 millones de años.' } },
  { id: 'coal', name: 'Coal swamp forests', age: 345, end: 300, approx: true, type: 'range',
    desc: 'Equatorial swamps of giant clubmoss trees, whose thick, lignin-rich bark was buried in acidic, oxygen-poor water and turned into most of the world’s coal.',
    es: { name: 'Bosques pantanosos del carbón', desc: 'Pantanos ecuatoriales de licopodios arbóreos gigantes, cuya corteza gruesa y rica en lignina quedó enterrada en agua ácida y pobre en oxígeno y se convirtió en la mayor parte del carbón del mundo.' } },
  { id: 'amniotes', name: 'First amniotes', age: 318, approx: true, type: 'event',
    desc: 'The shelled egg, with its own private pond inside, frees vertebrates from the water. Almost at once the amniotes split into synapsids (our line) and sauropsids (reptiles and birds). Hylonomus, from fossil tree stumps in Nova Scotia (312 million years ago), is one of the oldest known.',
    es: { name: 'Primeros amniotas', desc: 'El huevo con cáscara, con su propia charca privada dentro, libera a los vertebrados del agua. Casi enseguida los amniotas se dividen en sinápsidos (nuestra línea) y saurópsidos (reptiles y aves). Hylonomus, hallado en tocones fósiles de Nueva Escocia (hace 312 millones de años), es de los más antiguos conocidos.' } },
  { id: 'synapsids', name: 'First synapsids', age: 306, approx: true, type: 'event',
    desc: 'Archaeothyris, a lizard-like animal about 50 cm long with a single temporal fenestra behind each eye. The arch of bone below that opening is your cheekbone.',
    es: { name: 'Primeros sinápsidos', desc: 'Archaeothyris, un animal con aspecto de lagarto de unos 50 cm con una sola fenestra temporal detrás de cada ojo. El arco de hueso bajo esa abertura es tu pómulo.' } },
  { id: 'fungi', name: 'Wood-rotting fungi', age: 295, approx: true, type: 'event',
    desc: 'Genome studies date the enzymes that let white-rot fungi break down lignin to around this time.',
    talk: 'Gemini presented this as the switch that shut down coal formation. That link is contested: wood-decaying fungi may be older, and climate and tectonics probably mattered more.',
    es: { name: 'Hongos que pudren la madera', desc: 'Los estudios genómicos sitúan hacia esta época las enzimas con las que los hongos de podredumbre blanca descomponen la lignina.',
      talk: 'Gemini lo presentó como el interruptor que apagó la formación de carbón. Ese vínculo es discutido: los hongos que descomponen madera podrían ser más antiguos, y el clima y la tectónica probablemente pesaron más.' } },
  { id: 'dimetrodon', name: 'Dimetrodon', age: 290, approx: true, type: 'event',
    desc: 'The sail-backed synapsid, a top predator of the early Permian. It looks like a reptile but is closer to you than to any lizard.',
    es: { name: 'Dimetrodon', desc: 'El sinápsido con vela en la espalda, superdepredador del Pérmico temprano. Parece un reptil, pero está más cerca de ti que de cualquier lagarto.' } },
  { id: 'pareiasaurs', name: 'Pareiasaurs', age: 265, approx: true, type: 'event',
    desc: 'Armoured plant-eaters up to 3 metres long, such as Scutosaurus: parareptiles with solid skulls, the true "anapsids". Their line died out by the end of the Triassic.',
    es: { name: 'Pareiasaurios', desc: 'Herbívoros acorazados de hasta 3 metros, como Scutosaurus: parareptiles de cráneo macizo, los verdaderos «anápsidos». Su línea desapareció al final del Triásico.' } },
  { id: 'eunotosaurus', name: 'Eunotosaurus', age: 260, approx: true, type: 'event',
    desc: 'A middle Permian reptile from South Africa with broad, flattened ribs: the first step towards the turtle shell.',
    talk: 'Gemini placed it in the late Permian or early Triassic; it is middle Permian.',
    es: { name: 'Eunotosaurus', desc: 'Un reptil del Pérmico medio de Sudáfrica con costillas anchas y aplanadas: el primer paso hacia el caparazón de las tortugas.',
      talk: 'Gemini lo situó en el Pérmico tardío o el Triásico temprano; es del Pérmico medio.' } },
  { id: 'endperm', name: 'End-Permian extinction', age: 251.902, type: 'extinction', loss: 'About 81% of marine species, 70% of land vertebrates',
    cause: 'Massive eruptions of the Siberian Traps released carbon dioxide, causing extreme warming, ocean acidification and oxygen loss.',
    victims: 'Trilobites (the last ones), most corals, many synapsids, and the only mass extinction of insects.',
    desc: 'The Great Dying, the worst extinction in Earth’s history. Recovery took 5 to 10 million years. Its boundary is fixed by a golden spike at Meishan, China, at the first appearance of the conodont Hindeodus parvus.',
    talk: 'Gemini quoted 96% of marine species. That is the classic figure; recent studies put it nearer 81%.',
    es: { name: 'Extinción del final del Pérmico', loss: 'Cerca del 81 % de las especies marinas y el 70 % de los vertebrados terrestres',
      cause: 'Las erupciones masivas de los Traps Siberianos liberaron dióxido de carbono y provocaron un calentamiento extremo, acidificación oceánica y pérdida de oxígeno.',
      victims: 'Los últimos trilobites, la mayoría de los corales, muchos sinápsidos y la única extinción masiva de insectos.',
      desc: 'La Gran Mortandad, la peor extinción de la historia de la Tierra. La recuperación tardó de 5 a 10 millones de años. Su límite lo fija un clavo de oro en Meishan (China), en la primera aparición del conodonto Hindeodus parvus.',
      talk: 'Gemini citó un 96 % de especies marinas. Es la cifra clásica; estudios recientes la sitúan más cerca del 81 %.' } },
  { id: 'lystrosaurus', name: 'Lystrosaurus', age: 251, approx: true, type: 'event',
    desc: 'A pig-sized, beaked plant-eating therapsid that survived the Great Dying and became the commonest land animal of the early Triassic.',
    es: { name: 'Lystrosaurus', desc: 'Un terápsido herbívoro con pico, del tamaño de un cerdo, que sobrevivió a la Gran Mortandad y fue el animal terrestre más común del Triásico temprano.' } },
  { id: 'archosaurs', name: 'Archosaurs split', age: 247, approx: true, type: 'event',
    desc: 'The "ruling reptiles" divide into the crocodile line (Pseudosuchia) and the bird line (Avemetatarsalia), told apart by their ankle joints.',
    es: { name: 'Se dividen los arcosaurios', desc: 'Los «reptiles dominantes» se separan en la línea de los cocodrilos (Pseudosuchia) y la de las aves (Avemetatarsalia), que se distinguen por la articulación del tobillo.' } },
  { id: 'dinos', name: 'First dinosaurs', age: 233, approx: true, type: 'event',
    desc: 'Small, two-legged animals such as Eoraptor and Herrerasaurus in what is now Argentina.',
    es: { name: 'Primeros dinosaurios', desc: 'Animales pequeños y bípedos como Eoraptor y Herrerasaurus en lo que hoy es Argentina.' } },
  { id: 'pterosaurs', name: 'First pterosaurs', age: 228, approx: true, type: 'event',
    desc: 'The first vertebrates to fly under their own power, on a membrane stretched from a hugely elongated fourth finger. They are the sister group of the dinosaurs.',
    es: { name: 'Primeros pterosaurios', desc: 'Los primeros vertebrados con vuelo propio, sobre una membrana tendida desde un cuarto dedo enormemente alargado. Son el grupo hermano de los dinosaurios.' } },
  { id: 'mammals', name: 'First mammaliaforms', age: 225, approx: true, type: 'event',
    desc: 'Small, nocturnal, shrew-like animals such as Morganucodon, with fur, warm blood and the first mammal-style jaw joint.',
    es: { name: 'Primeros mamaliaformes', desc: 'Animales pequeños, nocturnos y parecidos a musarañas, como Morganucodon, con pelo, sangre caliente y la primera articulación mandibular de tipo mamífero.' } },
  { id: 'odontochelys', name: 'Odontochelys', age: 220, type: 'event',
    desc: 'A turtle from China with a full belly shell (plastron) but no back shell, and still with teeth.',
    talk: 'Gemini put it in the Middle Triassic; at about 220 million years it is Late Triassic.',
    es: { name: 'Odontochelys', desc: 'Una tortuga de China con el caparazón ventral (plastrón) completo pero sin caparazón dorsal, y todavía con dientes.',
      talk: 'Gemini la situó en el Triásico Medio; con unos 220 millones de años es del Triásico Superior.' } },
  { id: 'endtri', name: 'End-Triassic extinction', age: 201.4, type: 'extinction', loss: 'About 76% of species',
    cause: 'Eruptions of the Central Atlantic Magmatic Province as Pangaea began to split, with warming and ocean acidification.',
    victims: 'Many crocodile-line reptiles such as rauisuchians, large amphibians, and conodonts.',
    desc: 'It removed the dinosaurs’ main competitors, and dinosaurs dominated land for the next 135 million years.',
    es: { name: 'Extinción del final del Triásico', loss: 'Cerca del 76 % de las especies',
      cause: 'Erupciones de la Provincia Magmática del Atlántico Central cuando Pangea empezó a dividirse, con calentamiento y acidificación oceánica.',
      victims: 'Muchos reptiles de la línea de los cocodrilos como los rauisúquidos, grandes anfibios y conodontos.',
      desc: 'Eliminó a los principales competidores de los dinosaurios, que dominaron la tierra durante los siguientes 135 millones de años.' } },
  { id: 'jurmammals', name: 'Gliding and swimming mammals', age: 164, approx: true, type: 'event',
    desc: 'Castorocauda, a beaver-like swimmer, and gliders such as Volaticotherium show Jurassic mammals were far more varied than "small rats".',
    es: { name: 'Mamíferos planeadores y nadadores', desc: 'Castorocauda, un nadador parecido a un castor, y planeadores como Volaticotherium muestran que los mamíferos del Jurásico eran mucho más variados que «ratitas».' } },
  { id: 'archaeopteryx', name: 'Archaeopteryx', age: 150, approx: true, type: 'event',
    desc: 'A feathered dinosaur from Solnhofen, Germany, with wings, teeth and a bony tail: the classic link between dinosaurs and birds.',
    es: { name: 'Archaeopteryx', desc: 'Un dinosaurio con plumas de Solnhofen (Alemania), con alas, dientes y cola ósea: el clásico eslabón entre dinosaurios y aves.' } },
  { id: 'flowers', name: 'First flowering plants', age: 130, approx: true, type: 'event',
    desc: 'Fossil pollen of angiosperms. Molecular studies suggest an older origin, which is debated.',
    es: { name: 'Primeras plantas con flores', desc: 'Polen fósil de angiospermas. Los estudios moleculares sugieren un origen más antiguo, aún debatido.' } },
  { id: 'metatherians', name: 'Earliest marsupial relatives', age: 110, approx: true, type: 'event',
    desc: 'The first metatherians, the line leading to marsupials, appear in North America. An older Chinese fossil, Sinodelphys, was once counted here but has been reinterpreted as a placental relative.',
    es: { name: 'Primeros parientes de los marsupiales', desc: 'Los primeros metaterios, la línea que lleva a los marsupiales, aparecen en Norteamérica. Un fósil chino más antiguo, Sinodelphys, se contaba aquí pero se ha reinterpretado como pariente de los placentarios.' } },
  { id: 'placentals', name: 'Placental superorders split', age: 95, approx: true, type: 'event',
    desc: 'Molecular clocks place the split of Xenarthra, Afrotheria, Laurasiatheria and Euarchontoglires roughly here, tied to the break-up of Gondwana and Laurasia. Their fossils only become common after the asteroid.',
    talk: 'Gemini explained the Laurasiatheria–Euarchontoglires split with the Turgai Strait cutting Laurasia into a western and an eastern half. That is not an established explanation; where each group arose is still open.',
    es: { name: 'Se separan los superórdenes placentarios', desc: 'Los relojes moleculares sitúan aproximadamente aquí la separación de Xenarthra, Afrotheria, Laurasiatheria y Euarchontoglires, ligada a la fragmentación de Gondwana y Laurasia. Sus fósiles solo se vuelven comunes tras el asteroide.',
      talk: 'Gemini explicó la separación entre Laurasiatheria y Euarchontoglires con el estrecho de Turgai partiendo Laurasia en una mitad oeste y otra este. No es una explicación establecida; dónde surgió cada grupo sigue abierto.' } },
  { id: 'mosasaurs', name: 'Mosasaurs', age: 98, approx: true, type: 'event',
    desc: 'Marine squamates, relatives of monitor lizards and snakes, that grew to 17 metres and ruled late Cretaceous seas.',
    es: { name: 'Mosasaurios', desc: 'Escamosos marinos, parientes de los varanos y las serpientes, que alcanzaron 17 metros y dominaron los mares del Cretácico tardío.' } },
  { id: 'kpg', name: 'End-Cretaceous extinction', age: 66, type: 'extinction', loss: 'About 76% of species',
    cause: 'A 10 km asteroid struck Chicxulub on the Yucatán Peninsula, causing fires, darkness and cooling, while the Deccan Traps in India were also erupting.',
    victims: 'All non-avian dinosaurs, pterosaurs, mosasaurs, plesiosaurs, ammonites and rudist clams.',
    desc: 'A thin layer rich in iridium marks it worldwide; Luis and Walter Alvarez’s discovery of it in 1980 led to the impact hypothesis. Small, beaked, seed-eating birds made it through.',
    talk: 'K-Pg is the boundary, not the asteroid: K for the German Kreide (chalk, the Cretaceous), Pg for Paleogene. The crater is named after the Maya town of Chicxulub above its centre.',
    es: { name: 'Extinción del final del Cretácico', loss: 'Cerca del 76 % de las especies',
      cause: 'Un asteroide de 10 km chocó en Chicxulub (península de Yucatán), provocando incendios, oscuridad y enfriamiento, mientras también entraban en erupción los Traps del Decán en la India.',
      victims: 'Todos los dinosaurios no avianos, pterosaurios, mosasaurios, plesiosaurios, ammonites y almejas rudistas.',
      desc: 'Una fina capa rica en iridio la marca en todo el mundo; su descubrimiento por Luis y Walter Alvarez en 1980 dio pie a la hipótesis del impacto. Sobrevivieron aves pequeñas, con pico y comedoras de semillas.',
      talk: 'K-Pg es el límite, no el asteroide: K por el alemán Kreide (tiza, el Cretácico) y Pg por Paleógeno. El cráter debe su nombre al pueblo maya de Chicxulub, situado sobre su centro.' } },
  { id: 'petm', name: 'PETM hothouse', age: 56, type: 'event',
    desc: 'The Paleocene–Eocene Thermal Maximum: a huge release of carbon warmed the planet by 5–8 °C in a few thousand years, often studied as an analogue for today.',

  { id: 'antarctica', name: 'Antarctic ice sheet forms', age: 34, approx: true, type: 'event',

  { id: 'africa', name: 'Africa joins Eurasia', age: 19, approx: true, type: 'event',
